<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 解除 Google 圖片與雲端相片防盜鏈限制 -->
    <meta name="referrer" content="no-referrer">
    <title>質感生活同步互動地圖 - 回憶手帳版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <!-- Google 字體：手寫風與俏皮圓體字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .font-handwriting { font-family: 'Caveat', cursive, 'Noto Sans TC', sans-serif; }
        .font-rounded { font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; }

        /* 全域按鈕按壓互動視覺優化 */
        button, .btn-interactive {
            touch-action: manipulation;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active, .btn-interactive:active {
            transform: scale(0.94) !important;
            opacity: 0.85 !important;
        }

        /* 彈跳對話氣泡動畫 */
        @keyframes bubblePop {
            0% { transform: scale(0.85) translateY(8px); opacity: 0; }
            70% { transform: scale(1.02) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-bubble-pop {
            animation: bubblePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* 切換動效 1：同地點相片切換 (IG Story 快速淡入) */
        @keyframes photoFade {
            0% { opacity: 0.3; transform: scale(0.985); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-photo-fade {
            animation: photoFade 0.22s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 切換動效 2：跨地點景點切換 (卡片滑移+縮放) */
        @keyframes locationShift {
            0% { opacity: 0; transform: translateX(35px) scale(0.96); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-location-shift {
            animation: locationShift 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 心脈躍動微幅跳躍動畫 (Micro-Jump Heartbeat) */
        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.35); }
            60% { transform: translate(-50%, -50%) scale(0.92); }
            80% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* 時間軸焦點大光點平滑移動動畫 */
        #timelineActiveCursor {
            transition: left 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Leaflet 地圖彈出對話視窗尺寸 */
        .leaflet-popup {
            min-width: 320px !important;
            max-width: 90vw !important;
        }
        .leaflet-popup-content-wrapper {
            background: #fdfbf7 !important;
            color: #334155 !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 0.85rem !important;
            padding: 0.2rem !important;
            box-shadow: 0 12px 28px -5px rgba(0, 0, 0, 0.18) !important;
            max-height: 80dvh !important;
            overflow-y: auto !important;
        }
        .leaflet-popup-content {
            width: auto !important;
            min-width: 290px !important;
            margin: 12px !important;
        }

        .popup-notes {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .popup-img-container {
            height: auto !important;
            max-height: 320px !important;
            background-color: #f1f5f9 !important;
        }
        .popup-img-container img {
            object-fit: contain !important;
            height: auto !important;
            max-height: 310px !important;
        }

        .leaflet-control-geocoder {
            border: 1px solid #ddc8b4 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05) !important;
            border-radius: 0.5rem !important;
            background-color: #fdfbf7 !important;
        }

        .polaroid-card {
            background: #fff;
            padding: 8px 8px 12px 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }

        .timeline-item.active-timeline-item {
            background-color: #fdfbf7 !important;
            border-left: 4px solid #7f5539 !important;
            box-shadow: 0 4px 12px rgba(127, 85, 57, 0.15) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#f4ebe1] text-slate-700 h-[100dvh] w-screen flex flex-col md:flex-row font-sans relative overflow-hidden">

    <!-- 側邊欄區域 (手機版極簡極致美化) -->
    <div class="w-full md:w-80 bg-[#ede0d4] p-3 md:p-4 flex flex-col border-b md:border-b-0 md:border-r border-[#ddc8b4] shrink-0 z-[1000] shadow-md max-h-[45dvh] md:max-h-none md:h-full">
        
        <!-- 標題與分頁切換按鈕 (手機版預設僅顯示此區) -->
        <div class="shrink-0 mb-2">
            <div class="flex justify-between items-center mb-1.5">
                <h1 class="text-lg md:text-xl font-bold flex items-center gap-2 text-[#7f5539]">
                    <i data-lucide="heart-handshake" class="text-[#b7b7a4]"></i> 浪漫足跡手帳
                </h1>
                <!-- 手機版工具收納按鈕 -->
                <button onclick="toggleMobileControlPanel()" class="md:hidden text-xs bg-[#f5ebe0] text-[#7f5539] p-1.5 rounded-lg border border-[#ddc8b4] flex items-center gap-1 font-medium active:scale-95 transition">
                    <i data-lucide="settings-2" class="w-4 h-4"></i>
                </button>
            </div>
            
            <!-- 3 大主要分頁按鈕 -->
            <div class="grid grid-cols-3 gap-1 bg-[#dfd0c0] p-1 rounded-xl text-xs font-bold text-[#7f5539] shadow-inner">
                <button id="tabFolders" onclick="switchSidebarTab('folders')" class="py-1.5 rounded-lg bg-[#fdfbf7] shadow-xs text-center transition hover:bg-white">集合</button>
                <button id="tabTimeline" onclick="switchSidebarTab('timeline')" class="py-1.5 rounded-lg hover:bg-[#fdfbf7]/60 text-center transition">時間軸</button>
                <button id="tabGallery" onclick="switchSidebarTab('gallery')" class="py-1.5 rounded-lg hover:bg-[#fdfbf7]/60 text-center transition">拍立得</button>
            </div>
        </div>

        <!-- 可收折控制選單 (手機版預設隱藏，桌機版常駐) -->
        <div id="collapsibleControlPanel" class="hidden md:block shrink-0 space-y-2 mb-2">
            <!-- GAS 連線區塊 -->
            <div class="bg-[#f5ebe0]/80 p-2 rounded-lg border border-[#ddc8b4]">
                <label class="text-[10px] text-slate-500 block font-medium mb-1">Google GAS 雲端網址</label>
                <div class="flex gap-1">
                    <input type="text" id="gasUrlInput" class="w-full text-xs p-1.5 rounded bg-white border border-[#ddc8b4] text-slate-700 focus:outline-none focus:border-[#7f5539]" placeholder="請貼上 GAS Web App 網址">
                    <button id="btnConnectCloud" onclick="saveGasConfig()" class="text-xs bg-[#7f5539] hover:bg-[#9c6644] text-white px-2.5 py-1.5 rounded-md font-medium whitespace-nowrap shadow-xs">連線</button>
                </div>
            </div>

            <!-- 播放控制備用按鈕 -->
            <div id="timelineControlsArea" class="hidden flex flex-col gap-1 p-2 bg-[#f5ebe0]/90 rounded-lg border border-[#ddc8b4]">
                <div class="flex justify-between items-center gap-1">
                    <span class="text-xs font-semibold text-[#7f5539]">🎬 回憶故事放映</span>
                    <div class="flex items-center gap-1">
                        <button id="btnPrevTimeline" onclick="prevTimelinePhoto()" class="text-xs bg-white text-[#7f5539] border border-[#ddc8b4] px-1.5 py-0.5 rounded hover:bg-[#f5ebe0]"><i data-lucide="skip-back" class="w-3 h-3"></i></button>
                        <button id="btnPlayTimeline" onclick="toggleTimelinePlayback()" class="text-xs bg-[#7f5539] text-white px-2 py-0.5 rounded hover:bg-[#9c6644]">播放</button>
                        <button id="btnNextTimeline" onclick="nextTimelinePhoto()" class="text-xs bg-white text-[#7f5539] border border-[#ddc8b4] px-1.5 py-0.5 rounded hover:bg-[#f5ebe0]"><i data-lucide="skip-forward" class="w-3 h-3"></i></button>
                    </div>
                </div>
                <div class="flex items-center justify-between text-[10px] text-slate-600 mt-1">
                    <span>停留秒數:</span>
                    <input type="number" id="playbackDelayInput" min="1" max="10" step="0.5" value="3.5" onchange="savePlaybackDelay()" class="w-10 text-center p-0.5 rounded border border-[#ddc8b4] bg-white text-xs">
                </div>
            </div>

            <!-- 權限切換按鈕 -->
            <button id="btnToggleAuth" onclick="toggleAuthMode()" class="w-full text-xs bg-[#7f5539] hover:bg-[#9c6644] text-white py-1.5 rounded-md font-medium transition shadow-sm flex items-center justify-center gap-1.5">
                <i id="authIcon" data-lucide="eye" class="w-3.5 h-3.5"></i>
                <span id="authText">觀看模式</span>
            </button>
        </div>

        <!-- 內容切換區域 1: 我的景點集合 -->
        <div id="viewFolders" class="flex-1 overflow-y-auto min-h-0 space-y-2 pr-1 mb-1">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-bold text-[#7f5539] uppercase tracking-wider">景點集合</h2>
                <button id="btnCreateFolder" onclick="createNewFolder()" class="text-xs text-[#9c6644] flex items-center gap-1 hover:underline font-bold disabled:opacity-30 disabled:no-underline disabled:cursor-not-allowed">
                    <i data-lucide="folder-plus" class="w-3.5 h-3.5"></i>新增集合
                </button>
            </div>
            <div id="folderContainer" class="space-y-2"></div>
        </div>

        <!-- 內容切換區域 2: 時間軸檢視 (Timeline) -->
        <div id="viewTimeline" class="hidden flex-1 flex flex-col min-h-0 mb-1">
            <div id="timelineContainer" class="flex-1 overflow-y-auto min-h-0 space-y-2 pr-1 no-scrollbar relative">
                <!-- 動態注入時間軸節點 -->
            </div>
        </div>

        <!-- 內容切換區域 3: 拍立得相片牆 -->
        <div id="viewGallery" class="hidden flex-1 overflow-y-auto min-h-0 space-y-2 pr-1 mb-1">
            <div id="galleryContainer" class="space-y-2"></div>
        </div>
    </div>

    <!-- 主展示舞台 (地圖與星塵脈衝時間軸放映室) -->
    <div class="flex-1 h-[55dvh] md:h-full relative overflow-hidden bg-slate-900">
        <!-- 1. Leaflet 地圖容器 -->
        <div id="map" class="w-full h-full z-[1]"></div>

        <!-- 2. 故事放映舞台：採用 IG Story 沉浸放映模式 -->
        <div id="storyStage" class="hidden absolute inset-0 z-[500] bg-slate-950 flex flex-col justify-between items-center p-3 md:p-4 select-none overflow-hidden">
            <!-- 毛玻璃背景模糊底圖 -->
            <div id="storyBgBlur" class="absolute inset-0 bg-cover bg-center blur-2xl opacity-40 scale-110 transition-all duration-700 pointer-events-none"></div>
            <div class="absolute inset-0 bg-gradient-to-b from-black/80 via-transparent to-black/90 pointer-events-none"></div>

            <!-- 區塊一：頂部極簡時間軌道 -->
            <div class="w-full max-w-xl md:max-w-2xl z-40 shrink-0 mb-2">
                <div id="storyOverviewTrack" class="relative w-full pt-3 pb-5 px-5 bg-slate-950/85 backdrop-blur-md rounded-2xl border border-white/10 text-white shadow-2xl flex flex-col justify-center select-none">
                    <div class="relative w-full h-[2px] bg-white/20 rounded-full my-2 flex items-center">
                        <div id="timelineMonthTicks" class="absolute inset-0 pointer-events-none"></div>
                        <div id="timelineDateNodes" class="absolute inset-0 pointer-events-auto"></div>
                        <div id="timelineActiveCursor" class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-4 h-4 rounded-full bg-pink-500 ring-4 ring-pink-300/40 shadow-[0_0_15px_#f472b6] z-20 pointer-events-none">
                            <div class="w-full h-full rounded-full bg-white animate-ping opacity-30"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 區塊二：中央主體內容區 (標題 + 標題後面的半透明指示點點 + IG Story 展演舞台) -->
            <div class="relative z-30 w-full max-w-xl md:max-w-2xl flex-1 min-h-0 flex flex-col items-start my-1 overflow-hidden">
                <!-- 標題與小圓點排版 -->
                <div class="flex items-center gap-2 mb-2 drop-shadow-md shrink-0 w-full overflow-hidden">
                    <div class="w-7 h-7 md:w-8 md:h-8 rounded-full bg-gradient-to-tr from-amber-400 via-pink-500 to-rose-500 p-0.5 shadow-md flex items-center justify-center shrink-0">
                        <div id="storyHeaderIcon" class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center text-xs">💖</div>
                    </div>
                    
                    <div id="storyHeaderTitle" class="flex items-center gap-2 overflow-hidden flex-1">
                        <!-- 主旨與地點 -->
                    </div>

                    <!-- 半透明小圓點 (放在標題後面) -->
                    <div id="storyHeaderDots" class="flex items-center gap-1 shrink-0 ml-auto bg-black/30 backdrop-blur-md px-2 py-1 rounded-full border border-white/10">
                    </div>
                </div>

                <!-- IG Story 模式容器 (修復影片點擊與播放區域) -->
                <div id="storyMediaBox" class="w-full flex-1 min-h-0 flex flex-col items-center justify-center relative rounded-2xl overflow-hidden shadow-2xl border border-white/15 bg-slate-950/80 backdrop-blur-xs select-none">
                    
                    <!-- 🌟 變更 1：點擊切換感應區僅保留兩側 20%，中央 60% 區域留給影片播放控制鈕點擊 -->
                    <div onclick="prevTimelinePhoto()" class="absolute inset-y-0 left-0 w-1/5 z-30 cursor-pointer flex items-center justify-start pl-2 opacity-0 hover:opacity-100 transition"><span class="bg-black/50 text-white rounded-full p-1.5 shadow-md"><i data-lucide="chevron-left" class="w-5 h-5"></i></span></div>
                    <div onclick="nextTimelinePhoto()" class="absolute inset-y-0 right-0 w-1/5 z-30 cursor-pointer flex items-center justify-end pr-2 opacity-0 hover:opacity-100 transition"><span class="bg-black/50 text-white rounded-full p-1.5 shadow-md"><i data-lucide="chevron-right" class="w-5 h-5"></i></span></div>

                    <!-- 照片/影片內容顯示區域 -->
                    <div id="storyMediaContent" class="w-full h-full flex items-center justify-center overflow-hidden p-1">
                    </div>
                </div>
            </div>

            <!-- 區塊三：下方筆記手帳對話氣泡 -->
            <div class="w-full max-w-xl md:max-w-2xl z-30 shrink-0 mt-2 pointer-events-auto">
                <div id="storyBubble" class="animate-bubble-pop bg-white/95 backdrop-blur-md p-3 md:p-3.5 rounded-2xl shadow-2xl border-2 border-pink-200/80 text-slate-800">
                    <!-- 🌟 變更 2：地點拿掉、日期前移、右上角所屬集合字體放大 -->
                    <div class="flex items-center justify-between gap-2 mb-1.5 border-b border-pink-100 pb-1">
                        <span id="storyBubbleDate" class="text-xs md:text-sm text-pink-600 font-bold font-rounded shrink-0 flex items-center gap-1">
                            📅 2026-02-27
                        </span>
                        <span id="storyBubbleFolder" class="text-xs md:text-sm bg-pink-50 text-pink-600 px-2.5 py-0.5 rounded-full font-bold border border-pink-200 shrink-0">
                            我們的旅程
                        </span>
                    </div>
                    <div id="storyBubbleNotes" class="text-xs md:text-sm text-slate-700 leading-relaxed font-rounded popup-notes max-h-20 overflow-y-auto pr-1">
                        這裡會顯示滿滿的俏皮筆記跟顏文字喔！(*´∀`)~♥
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 景點編輯與新增面板 -->
    <div id="editPanel" class="hidden w-full md:w-80 bg-[#fdfbf7] p-4 border-t md:border-t-0 md:border-l border-[#ddc8b4] md:h-full flex flex-col z-[1000] shadow-xl">
        <div class="flex justify-between items-center mb-3">
            <h3 id="panelTitle" class="font-bold text-base md:text-lg text-[#7f5539]">編輯手帳細節</h3>
            <button onclick="closePanel()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x"></i></button>
        </div>
        
        <div class="space-y-3 flex-1 overflow-y-auto text-sm text-slate-600 pr-1">
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">主旨</label>
                <input type="text" id="placeTitle" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]" placeholder="例如：卡地亞 part1!!">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">地點名稱</label>
                <input type="text" id="placeLocation" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]" placeholder="例如：卡地亞 / 月津港">
            </div>
            
            <div>
                <label class="block text-xs font-medium text-[#7f5539] font-bold mb-1 flex items-center gap-1">
                    <i data-lucide="calendar-heart" class="w-3.5 h-3.5 text-pink-500"></i> 紀念/踩點日期
                </label>
                <input type="date" id="placeDate" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">所屬集合</label>
                <select id="placeFolder" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]"></select>
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">標記顏色</label>
                    <select id="placeColor" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800">
                        <option value="red">🔴 紅色</option>
                        <option value="blue">🔵 藍色</option>
                        <option value="green">🟢 綠色</option>
                        <option value="yellow">🟡 黃色</option>
                        <option value="purple">🟣 紫色</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">標記圖標</label>
                    <select id="placeIcon" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800">
                        <option value="map-pin">📍 預設點</option>
                        <option value="footprints">👣 我們的足跡</option>
                        <option value="utensils">🍴 美食餐廳</option>
                        <option value="heart">💖 第一次/紀念</option>
                        <option value="calendar">📅 未來計畫</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">圖片網址 (多張請用逗號 , 隔開)</label>
                <input type="text" id="placeImageUrl" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]" placeholder="網址1, 網址2...">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">影片網址 (YouTube / Google Drive / MP4)</label>
                <input type="text" id="placeVideoUrl" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]" placeholder="https://...">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 mb-1">筆記想法</label>
                <textarea id="placeNotes" rows="3" class="w-full p-2 rounded-md bg-white border border-slate-200 text-slate-800 focus:outline-none focus:border-[#7f5539]"></textarea>
            </div>
        </div>

        <div class="pt-3 border-t border-slate-100 flex gap-2 shrink-0">
            <button onclick="deleteMarker()" id="btnDelete" class="flex-1 py-1.5 bg-red-50 text-red-600 rounded-md hover:bg-red-100 transition font-medium text-sm">刪除</button>
            <button onclick="saveMarkerData()" class="flex-1 py-1.5 bg-[#7f5539] text-white rounded-md hover:bg-[#9c6644] transition font-medium text-sm shadow-sm">儲存並同步</button>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([23.6, 121.0], 7);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const CustomTaiwanGeocoder = {
            geocode: function(query) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=zh-TW&limit=6`;
                
                return fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error("網路請求失敗");
                        return res.json();
                    })
                    .then(data => {
                        if (!data || data.length === 0) return [];

                        return data.map(item => {
                            let cleanName = item.display_name
                                .replace(/, 臺灣|, 中華民國/g, '')
                                .split(', ').reverse().join(' ').trim();

                            const lat = parseFloat(item.lat);
                            const lng = parseFloat(item.lon);

                            return {
                                name: cleanName,
                                center: L.latLng(lat, lng),
                                bounds: L.latLngBounds(
                                    [parseFloat(item.boundingbox[0]), parseFloat(item.boundingbox[2])],
                                    [parseFloat(item.boundingbox[1]), parseFloat(item.boundingbox[3])]
                                )
                            };
                        });
                    })
                    .catch((err) => {
                        console.error("全球搜尋發生錯誤:", err);
                        return [];
                    });
            }
        };

        const geocoder = L.Control.geocoder({
            geocoder: CustomTaiwanGeocoder,
            defaultMarkGeocode: false,
            placeholder: "搜尋全球景點、城市或台灣地址...",
            errorMessage: "找不到這個地點呢..."
        })
        .on('markgeocode', function(e) {
            if (!isEditMode) {
                const latlng = e.geocode.center;
                map.setView(latlng, 16);
                return;
            }

            const latlng = e.geocode.center;
            const name = e.geocode.name;
            
            map.setView(latlng, 16);
            
            activeId = null;
            currentLatLng = latlng;
            if (currentMarker) map.removeLayer(currentMarker);
            
            currentMarker = L.marker(latlng, { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
            
            openPanel(true);
            document.getElementById('placeTitle').value = name;
            document.getElementById('placeLocation').value = name;
            lucide.createIcons();
        })
        .addTo(map);

        let markersData = [];
        let markerInstances = {}; 
        let currentMarker = null;
        let activeId = null;
        let currentLatLng = null;
        let gasUrl = localStorage.getItem('gasUrl') || '';
        let playbackDelay = parseFloat(localStorage.getItem('playbackDelay')) || 3.5; 
        
        let playbackState = 'stopped';
        let currentPlaybackItemIndex = 0;
        let currentPlaybackImgIndex = 0;
        let playbackTimer = null;

        let timelineSortable = null;
        let folders = JSON.parse(localStorage.getItem('mapFolders')) || ['行程總覽', '美食口袋名單', '住宿備忘'];
        let isEditMode = false;

        document.getElementById('gasUrlInput').value = gasUrl;
        document.getElementById('playbackDelayInput').value = playbackDelay;

        const colorMap = { red: '#ef4444', blue: '#3b82f6', green: '#10b981', yellow: '#eab308', purple: '#a855f7' };

        const iconEmojiMap = {
            'map-pin': '📍',
            'footprints': '👣',
            'utensils': '🍴',
            'heart': '💖',
            'calendar': '📅',
            'first-time': '💖',
            'calendar-days': '📅',
            'calendar-heart': '📅'
        };

        function toggleMobileControlPanel() {
            const panel = document.getElementById('collapsibleControlPanel');
            panel.classList.toggle('hidden');
        }

        function getLocKey(lat, lng) {
            const nLat = parseFloat(lat);
            const nLng = parseFloat(lng);
            if (isNaN(nLat) || isNaN(nLng)) return null;
            return `${nLat.toFixed(5)},${nLng.toFixed(5)}`;
        }

        function getGroupedItems() {
            const groups = {};
            markersData.forEach(item => {
                const key = getLocKey(item.lat, item.lng);
                if (!key) return;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            return groups;
        }

        function parseImageUrls(rawStr) {
            if (!rawStr) return [];
            return String(rawStr)
                .split(/[,，\n]+/)
                .map(s => s.trim())
                .filter(Boolean);
        }

        function convertGoogleDriveLink(url) {
            if (!url) return '';
            url = String(url).trim();
            if (url.includes('drive.google.com')) {
                let id = '';
                if (url.includes('/file/d/')) {
                    id = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('id=')) {
                    id = url.split('id=')[1].split('&')[0];
                } else if (url.includes('/d/')) {
                    id = url.split('/d/')[1].split('/')[0];
                }
                if (id) {
                    return "https://lh3.googleusercontent.com/d/" + id;
                }
            }
            return url;
        }

        function getGoogleDriveOriginalLink(url) {
            return convertGoogleDriveLink(url);
        }

        function formatDateString(dateStr) {
            if (!dateStr) return '';
            let str = String(dateStr).trim();

            if (str.includes('T')) {
                let d = new Date(str);
                if (!isNaN(d.getTime())) {
                    let year = d.getFullYear();
                    let month = String(d.getMonth() + 1).padStart(2, '0');
                    let day = String(d.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                }
            }

            const match = str.match(/\d{4}-\d{2}-\d{2}/);
            if (match) {
                return match[0];
            }
            return str;
        }

        function savePlaybackDelay() {
            const val = parseFloat(document.getElementById('playbackDelayInput').value) || 3.5;
            playbackDelay = val;
            localStorage.setItem('playbackDelay', val);
        }

        /* 🌟 變更 1：修復影片播放 (修復 Google Drive / YouTube iframe 嵌入) */
        function getVideoEmbedHtml(url) {
            if (!url) return '';
            url = url.trim();

            let fileId = '';
            if (url.includes('drive.google.com')) {
                if (url.includes('/file/d/')) {
                    fileId = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('id=')) {
                    fileId = url.split('id=')[1].split('&')[0];
                } else if (url.includes('/d/')) {
                    fileId = url.split('/d/')[1].split('/')[0];
                }
                if (fileId) {
                    return `<iframe class="w-full h-full min-h-[200px] max-h-[55dvh] rounded-xl z-20 pointer-events-auto" src="https://drive.google.com/file/d/${fileId}/preview" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                }
            }

            if (url.match(/\.(mp4|webm|ogg)($|\?)/i)) {
                return `<video class="w-full max-h-[55dvh] object-contain rounded-xl z-20 pointer-events-auto" controls playsinline webkit-playsinline preload="metadata">
                            <source src="${url}">
                        </video>`;
            }

            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0].split('/')[0];
            } else if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(url).search);
                videoId = urlParams.get('v');
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('youtube.com/embed/')[1].split('?')[0];
            } else if (url.includes('youtube.com/shorts/')) {
                videoId = url.split('youtube.com/shorts/')[1].split('?')[0];
            }

            if (videoId) {
                return `<iframe class="w-full aspect-video max-h-[55dvh] rounded-xl z-20 pointer-events-auto" src="https://www.youtube.com/embed/${videoId}?autoplay=0&playsinline=1&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
            }

            return `<iframe class="w-full h-full rounded-xl z-20 pointer-events-auto" src="${url}" frameborder="0" allow="fullscreen"></iframe>`;
        }

        function createCustomIcon(colorName, iconName) {
            const color = colorMap[colorName] || '#3b82f6';
            const emoji = iconEmojiMap[iconName] || '📍';
            
            const svgPinBg = `
                <svg width="36" height="36" viewBox="0 0 40 40" style="display:block;">
                    <path d="M20 2C13.1 2 7.5 7.6 7.5 14.5C7.5 23.2 20 37 20 37S32.5 23.2 32.5 14.5C32.5 7.6 26.9 2 20 2Z" fill="${color}"/>
                    <circle cx="20" cy="14.5" r="9" fill="white"/>
                </svg>
            `;

            return L.divIcon({
                html: `
                    <div style="position:relative; width:36px; height:36px;">
                        ${svgPinBg}
                        <div style="position:absolute; top:3px; left:0; width:36px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; pointer-events:none; user-select:none;">
                            ${emoji}
                        </div>
                    </div>
                `,
                className: 'custom-leaflet-icon-emoji',
                iconSize: [36, 36],
                iconAnchor: [18, 33]
            });
        }

        map.on('click', function(e) {
            if (!isEditMode) return;
            if (e.originalEvent.target.id === 'map' || e.originalEvent.target.classList.contains('leaflet-container')) {
                activeId = null;
                currentLatLng = e.latlng;
                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker(e.latlng, { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
                openPanel(true);
                lucide.createIcons();
            }
        });

        window.addNewEntryAtLocation = function(locKey) {
            if (!isEditMode) {
                alert("請先解鎖【編輯模式】才能新增手帳喔！");
                return;
            }
            const parts = locKey.split(',');
            if (parts.length === 2) {
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);
                activeId = null;
                currentLatLng = { lat, lng };
                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker([lat, lng], { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
                openPanel(true);
                lucide.createIcons();
            }
        };

        window.openEditPanelForItemById = function(itemId) {
            if (!isEditMode) return;
            const item = markersData.find(m => m.id === itemId);
            if (item) {
                openEditPanelForItem(item);
            }
        };

        function openEditPanelForItem(item) {
            if (!isEditMode || !item) return;
            
            activeId = item.id;
            currentLatLng = { lat: parseFloat(item.lat), lng: parseFloat(item.lng) };
            
            openPanel(false);
            
            document.getElementById('placeTitle').value = item.title || '';
            document.getElementById('placeLocation').value = item.location || '';
            document.getElementById('placeDate').value = formatDateString(item.date) || '';
            document.getElementById('placeNotes').value = item.notes || '';
            document.getElementById('placeImageUrl').value = item.image_url || '';
            document.getElementById('placeVideoUrl').value = item.video_url || '';
            document.getElementById('placeColor').value = item.color || 'blue';
            document.getElementById('placeIcon').value = item.icon || 'map-pin';
            
            const folderSelect = document.getElementById('placeFolder');
            if (folderSelect && item.folder_name) {
                folderSelect.value = item.folder_name;
            }
        }

        function openPanel(isNew = false) {
            if (!isEditMode) return;
            document.getElementById('editPanel').classList.remove('hidden');
            updateFolderSelect();
            if (isNew) {
                document.getElementById('panelTitle').innerText = "新增浪漫景點";
                document.getElementById('placeTitle').value = "";
                document.getElementById('placeLocation').value = "";
                document.getElementById('placeDate').value = new Date().toISOString().split('T')[0];
                document.getElementById('placeNotes').value = "";
                document.getElementById('placeImageUrl').value = "";
                document.getElementById('placeVideoUrl').value = "";
                document.getElementById('btnDelete').classList.add('hidden');
                document.getElementById('placeColor').value = 'blue';
                document.getElementById('placeIcon').value = 'map-pin';
            } else {
                document.getElementById('panelTitle').innerText = "編輯手帳細節";
                document.getElementById('btnDelete').classList.remove('hidden');
            }
        }

        function closePanel() {
            document.getElementById('editPanel').classList.add('hidden');
            if (currentMarker && !activeId) {
                map.removeLayer(currentMarker);
                currentMarker = null;
            }
            activeId = null;
        }

        function updateFolderSelect() {
            const select = document.getElementById('placeFolder');
            if (!select) return;
            const currentSelectedValue = select.value || '';
            const allFolders = Array.from(new Set([...folders, ...markersData.map(m => m.folder_name).filter(Boolean)]));
            select.innerHTML = allFolders.map(f => `<option value="${f}">${f}</option>`).join('');
            if (currentSelectedValue && allFolders.includes(currentSelectedValue)) select.value = currentSelectedValue;
        }

        function createNewFolder() {
            if (!isEditMode) return;
            const name = prompt("請輸入新集合名稱：");
            if (name && !folders.includes(name)) {
                folders.push(name);
                saveFoldersToStorage();
                updateFolderSelect();
                renderSidebar();
                renderGallery();
            }
        }

        async function renameFolder(oldName) {
            if (!isEditMode) return;
            const newName = prompt(`將集合「${oldName}」修改為新名稱：`, oldName);
            if (!newName || newName.trim() === '' || newName === oldName) return;
            if (folders.includes(newName)) { alert("已經有同名的集合囉！"); return; }

            folders = folders.map(f => f === oldName ? newName : f);
            saveFoldersToStorage();
            updateFolderSelect();

            for (let item of markersData) {
                if (item.folder_name === oldName) {
                    item.folder_name = newName;
                    if (gasUrl) {
                        try {
                            await fetch(gasUrl, {
                                method: 'POST', mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'save', data: item })
                            });
                        } catch(e){}
                    }
                }
            }
            fetchCloudData();
        }

        async function deleteFolder(folderName) {
            if (!isEditMode) return;
            if (!confirm(`確定要刪除「${folderName}」集合嗎？裡面的景點會被移至行程總覽。`)) return;

            folders = folders.filter(f => f !== folderName);
            saveFoldersToStorage();
            updateFolderSelect();

            for (let item of markersData) {
                if (item.folder_name === folderName) {
                    item.folder_name = '行程總覽';
                    if (gasUrl) {
                        try {
                            await fetch(gasUrl, {
                                method: 'POST', mode: 'no-cors',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ action: 'save', data: item })
                            });
                        } catch(e){}
                    }
                }
            }
            fetchCloudData();
        }

        function saveFoldersToStorage() { localStorage.setItem('mapFolders', JSON.stringify(folders)); }

        async function saveMarkerData() {
            if (!isEditMode) return;
            const title = document.getElementById('placeTitle').value || "未命名主旨";
            const location = document.getElementById('placeLocation').value || "";
            
            const rawDateVal = document.getElementById('placeDate').value || ""; 
            const date = formatDateString(rawDateVal);

            const existingItem = activeId ? markersData.find(m => m.id === activeId) : null;
            const inTimeline = existingItem ? (existingItem.in_timeline || 'yes') : 'yes';

            const notes = document.getElementById('placeNotes').value;
            const imageUrl = document.getElementById('placeImageUrl').value;
            const videoUrl = document.getElementById('placeVideoUrl').value;
            const color = document.getElementById('placeColor').value;
            let icon = document.getElementById('placeIcon').value;
            const folder = document.getElementById('placeFolder').value;

            const id = activeId || 'id_' + Date.now();
            const lat = currentLatLng ? currentLatLng.lat : (currentMarker ? currentMarker.getLatLng().lat : 23.6);
            const lng = currentLatLng ? currentLatLng.lng : (currentMarker ? currentMarker.getLatLng().lng : 121.0);

            const folderItems = markersData.filter(m => m.folder_name === folder);
            const maxOrder = folderItems.reduce((max, item) => (item.order > max ? item.order : max), Date.now());
            const itemOrder = existingItem && existingItem.order !== undefined ? existingItem.order : (maxOrder + 1000);

            const dataItem = { id, title, location, date, in_timeline: inTimeline, lat, lng, notes, video_url: videoUrl, image_url: imageUrl, color, icon, folder_name: folder, order: itemOrder };

            if (gasUrl) {
                try {
                    await fetch(gasUrl, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'save', data: dataItem })
                    });
                } catch (e) { console.error(e); }
            }

            if (activeId) markersData = markersData.filter(m => m.id !== id);
            markersData.push(dataItem);
            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = null;
            
            closePanel();
            fetchCloudData();
        }

        async function deleteMarker() {
            if (!isEditMode || !activeId) return;
            if (!confirm("確定要刪除這個景點手帳嗎？")) return;
            if (gasUrl) {
                try {
                    await fetch(gasUrl, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'save', data: { id: activeId, action: 'delete' } })
                    });
                } catch(e){}
            }
            markersData = markersData.filter(m => m.id !== activeId);
            closePanel();
            fetchCloudData();
        }

        function saveGasConfig() {
            let inputUrl = document.getElementById('gasUrlInput').value.trim();
            if (!inputUrl) {
                alert("請先貼上有效的 Google GAS 網址喔！");
                return;
            }

            if (inputUrl.includes('/edit') || inputUrl.includes('/dev')) {
                alert("⚠️ 注意：網址結尾必須是 /exec 喔！請重新部署並複製正確的 Web App 網址。");
                return;
            }

            gasUrl = inputUrl;
            localStorage.setItem('gasUrl', gasUrl);
            fetchCloudData(true);
        }

        window.changePopupMedia = function(itemId, dir = 0) {
            const container = document.getElementById(`popup_img_box_${itemId}`);
            if (!container) return;
            
            const rawMedia = container.getAttribute('data-media');
            if (!rawMedia) return;
            
            let mediaList = [];
            try {
                mediaList = JSON.parse(decodeURIComponent(rawMedia));
            } catch(e) { return; }
            if (mediaList.length === 0) return;

            let currentIndex = parseInt(container.getAttribute('data-index')) || 0;
            currentIndex += dir;
            if (currentIndex < 0) currentIndex = mediaList.length - 1;
            if (currentIndex >= mediaList.length) currentIndex = 0;

            container.setAttribute('data-index', currentIndex);
            currentPlaybackImgIndex = currentIndex;

            const contentArea = container.querySelector('.media-content-area');
            const countEl = container.querySelector('.img-count-badge');
            
            const item = mediaList[currentIndex];
            const itemTitle = container.getAttribute('data-title') || '';
            const galleryGroup = `gallery_${itemId}`;

            if (contentArea) {
                if (item.type === 'image') {
                    const safeImg = convertGoogleDriveLink(item.url);
                    contentArea.innerHTML = `
                        <a href="${getGoogleDriveOriginalLink(item.url)}" data-caption="${itemTitle}" data-fancybox="${galleryGroup}" class="w-full h-full flex items-center justify-center">
                            <img src="${safeImg}" class="w-full h-full object-cover map-thumb" onerror="this.parentElement.parentElement.innerHTML='<span class=\\'text-[10px] text-slate-400\\'>圖片載入中/未公開</span>'">
                        </a>`;
                } else if (item.type === 'video') {
                    const videoHtml = getVideoEmbedHtml(item.url);
                    contentArea.innerHTML = `<div class="w-full h-full bg-black flex items-center justify-center">${videoHtml}</div>`;
                }
            }

            if (countEl) {
                const icon = item.type === 'video' ? '🎬 ' : '';
                countEl.innerText = `${icon}${currentIndex + 1}/${mediaList.length}`;
            }

            Fancybox.bind("[data-fancybox]", {
                Hash: false, Thumbs: false,
                Toolbar: { display: { left: ["infobar"], middle: [], right: ["zoomIn", "zoomOut", "close"] } }
            });
        };

        async function fetchCloudData(showAlert = false) {
            if (!gasUrl) return;

            let cleanUrl = gasUrl.split('?')[0];
            let targetUrl = cleanUrl + '?action=read&_t=' + Date.now();

            try {
                const res = await fetch(targetUrl, { method: 'GET', redirect: 'follow' });
                if (res.ok) {
                    const json = await res.json();
                    if (json && (json.data || Array.isArray(json))) {
                        renderMapMarkers(json.data || json);
                        if (showAlert) alert("✅ 連線成功！已成功同步雲端手帳。");
                        return;
                    }
                }
            } catch (e) {
                console.warn("直連嘗試失敗，切換至備用代理：", e);
            }

            try {
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const proxyData = await res.json();
                    const json = JSON.parse(proxyData.contents);
                    if (json && (json.data || Array.isArray(json))) {
                        renderMapMarkers(json.data || json);
                        if (showAlert) alert("✅ 連線成功！已成功同步雲端手帳。");
                        return;
                    }
                }
            } catch (e) {
                console.error("備用代理連線失敗：", e);
            }

            if (showAlert) {
                alert("❌ 連線失敗！請確認 GAS 網址是否正確。");
            }
        }

        window.showGroupListInPopup = function(locKey) {
            const marker = markerInstances[locKey];
            if (!marker) return;

            const groups = getGroupedItems();
            let items = groups[locKey] || [];
            if (items.length === 0) return;

            items = [...items].sort((a, b) => {
                const dateA = formatDateString(a.date) || '9999-99-99';
                const dateB = formatDateString(b.date) || '9999-99-99';
                if (dateA === dateB) return (a.order || 0) - (b.order || 0);
                return dateA.localeCompare(dateB);
            });

            let listHtml = `<div class="p-1 text-slate-700">`;
            listHtml += `<div class="font-bold text-sm text-[#7f5539] mb-2 pb-1 border-b border-[#ddc8b4] flex justify-between items-center">`;
            listHtml += `<span class="flex items-center gap-1"><i data-lucide="layers" class="w-4 h-4 text-[#b7b7a4]"></i> 地點手帳列表 (${items.length})</span>`;
            
            if (isEditMode) {
                listHtml += `<button onclick="addNewEntryAtLocation('${locKey}')" class="text-[11px] bg-[#7f5539] text-white px-2 py-0.5 rounded-md hover:bg-[#9c6644] transition shadow-2xs font-medium">+ 新增手帳</button>`;
            }
            listHtml += `</div>`;

            listHtml += `<div class="space-y-1.5 max-h-[220px] overflow-y-auto pr-1">`;
            items.forEach(item => {
                const cleanDate = formatDateString(item.date) || '未設定日期';
                listHtml += `
                    <div onclick="showItemDetailInPopup('${locKey}', '${item.id}', true, 0)" class="btn-interactive p-2 rounded-lg bg-white/90 border border-slate-200/80 hover:border-[#7f5539] hover:bg-[#fdfbf7] cursor-pointer transition flex items-center justify-between shadow-2xs">
                        <div>
                            <div class="font-bold text-xs text-slate-800">${item.title}</div>
                            <div class="text-[10px] text-pink-600 font-medium flex items-center gap-1 mt-0.5">📅 ${cleanDate}</div>
                        </div>
                        <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                    </div>
                `;
            });
            listHtml += `</div></div>`;

            marker.bindPopup(listHtml, { autoPan: false }).openPopup();
            lucide.createIcons();
        };

        window.showItemDetailInPopup = function(locKey, itemId, showBackBtn = false, initialMediaIndex = 0) {
            const marker = markerInstances[locKey];
            if (!marker) return;

            const item = markersData.find(m => m.id === itemId);
            if (!item) return;

            const rawImages = parseImageUrls(item.image_url);
            const videoUrl = item.video_url ? item.video_url.trim() : '';
            const cleanDate = formatDateString(item.date);

            const mediaList = [];
            rawImages.forEach(img => mediaList.push({ type: 'image', url: img }));
            if (videoUrl) mediaList.push({ type: 'video', url: videoUrl });

            let validIndex = parseInt(initialMediaIndex) || 0;
            if (validIndex < 0) validIndex = 0;
            if (validIndex >= mediaList.length) validIndex = Math.max(0, mediaList.length - 1);

            currentPlaybackImgIndex = validIndex;

            let popupHtml = '<div class="p-1 text-slate-700">';

            if (showBackBtn) {
                popupHtml += `
                    <button onclick="showGroupListInPopup('${locKey}')" class="text-xs text-[#7f5539] hover:underline mb-1.5 font-bold flex items-center gap-1 btn-interactive">
                        ❮ 返回列表
                    </button>
                `;
            }

            const locationTag = item.location ? `<span class="text-xs font-normal text-slate-500">📍 ${item.location}</span>` : '';

            popupHtml += `
                <div class="font-bold text-sm text-[#7f5539] mb-0.5 flex items-center justify-between gap-1">
                    <span class="flex items-center gap-1.5">${item.title} ${locationTag}</span>
                    ${videoUrl ? '<span class="text-[10px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-medium border border-amber-200 shrink-0">🎥 內含影片</span>' : ''}
                </div>`;

            if (cleanDate) {
                popupHtml += `<div class="text-[11px] text-pink-600 font-medium mb-1.5 flex items-center gap-1">📅 ${cleanDate}</div>`;
            }

            if (mediaList.length > 0) {
                const currentItem = mediaList[validIndex];
                const encodedMediaList = encodeURIComponent(JSON.stringify(mediaList));
                const galleryGroup = `gallery_${item.id}`;

                let contentHtml = '';
                if (currentItem.type === 'image') {
                    const safeImg = convertGoogleDriveLink(currentItem.url);
                    contentHtml = `
                        <a href="${getGoogleDriveOriginalLink(currentItem.url)}" data-caption="${item.title}" data-fancybox="${galleryGroup}" class="w-full h-full flex items-center justify-center">
                            <img src="${safeImg}" class="w-full h-full object-cover map-thumb" onerror="this.parentElement.parentElement.innerHTML='<span class=\\'text-[10px] text-slate-400\\'>圖片載入中/未公開</span>'">
                        </a>`;
                } else if (currentItem.type === 'video') {
                    const videoHtml = getVideoEmbedHtml(currentItem.url);
                    contentHtml = `<div class="w-full h-full bg-black flex items-center justify-center">${videoHtml}</div>`;
                }

                const iconPrefix = currentItem.type === 'video' ? '🎬 ' : '';

                popupHtml += `
                    <div id="popup_img_box_${item.id}" data-media="${encodedMediaList}" data-title="${item.title}" data-index="${validIndex}" class="popup-img-container relative w-full rounded-lg overflow-hidden bg-slate-100 flex items-center justify-center mt-1 mb-1.5 shadow-sm group select-none">
                        <div class="media-content-area w-full h-full flex items-center justify-center">
                            ${contentHtml}
                        </div>
                        ${mediaList.length > 1 ? `
                            <span class="img-count-badge absolute top-1 right-1 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded-md z-10 pointer-events-none">${iconPrefix}${validIndex + 1}/${mediaList.length}</span>
                            <button onclick="event.stopPropagation(); changePopupMedia('${item.id}', -1)" class="btn-interactive absolute left-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-md z-10 font-bold">❮</button>
                            <button onclick="event.stopPropagation(); changePopupMedia('${item.id}', 1)" class="btn-interactive absolute right-1 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs shadow-md z-10 font-bold">❯</button>
                        ` : ''}
                    </div>`;

            if (item.notes) {
                popupHtml += '<div class="text-[12px] text-slate-600 popup-notes mt-1 border-t border-slate-100 pt-1.5 leading-relaxed">' + item.notes + '</div>';

                popupHtml += `
                    <div class="mt-2 pt-1.5 border-t border-slate-200 flex justify-between items-center">
                        <button onclick="addNewEntryAtLocation('${locKey}')" class="text-xs text-[#7f5539] hover:underline font-medium">+ 在此新增手帳</button>
                        <button onclick="openEditPanelForItemById('${item.id}')" class="text-xs bg-[#7f5539] text-white px-2 py-1 rounded hover:bg-[#9c6644] font-medium transition shadow-2xs">編輯此手帳</button>
                    </div>

            marker.bindPopup(popupHtml, { autoPan: false }).openPopup();

                openEditPanelForItem(item);
