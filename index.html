        function renderMapMarkers(data) {
            markersData = data || [];
            markersData.sort((a, b) => (a.order || 0) - (b.order || 0));

            map.eachLayer(layer => {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });
            markerInstances = {};

            const groups = getGroupedItems();

            Object.keys(groups).forEach(locKey => {
                const items = groups[locKey];
                if (!items || items.length === 0) return;
                const primaryItem = items[0];

                const lat = parseFloat(primaryItem.lat);
                const lng = parseFloat(primaryItem.lng);
                
                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return;

                try {
                    const marker = L.marker([lat, lng], { 
                        icon: createCustomIcon(primaryItem.color, primaryItem.icon) 
                    }).addTo(map);

                    markerInstances[locKey] = marker;

                    marker.on('click', () => {
                        closeStoryStage(); 
                        const targetLatLng = L.latLng(lat, lng);
                        const targetZoom = Math.max(map.getZoom(), 15);
                        const targetPoint = map.project(targetLatLng, targetZoom);
                        const offsetPoint = L.point(targetPoint.x, targetPoint.y - 120); 
                        const centerLatLng = map.unproject(offsetPoint, targetZoom);

                        map.setView(centerLatLng, targetZoom, { animate: true, duration: 0.5 });

                        const currentGroups = getGroupedItems();
                        const currentItems = currentGroups[locKey] || [];
                        if (currentItems.length > 1) {
                            showGroupListInPopup(locKey);
                        } else if (currentItems.length === 1) {
                            showItemDetailInPopup(locKey, currentItems[0].id, false, 0);
                        }
                    });
                } catch (err) {
                    console.error("地圖標記繪製跳過：", primaryItem, err);
                }
            });

            renderSidebar();
            renderTimeline();
            renderGallery();
            updateFolderSelect();
            
            lucide.createIcons();

            Fancybox.bind("[data-fancybox]", {
                Hash: false, Thumbs: false,
                Toolbar: { display: { left: ["infobar"], middle: [], right: ["zoomIn", "zoomOut", "close"] } }
            });
        }

        function switchSidebarTab(tabName) {
            const tabs = ['folders', 'timeline', 'gallery'];
            tabs.forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                const view = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
                
                if (t === tabName) {
                    btn.classList.add('bg-[#fdfbf7]', 'shadow-xs');
                    btn.classList.remove('hover:bg-[#fdfbf7]/60');
                    view.classList.remove('hidden');
                } else {
                    btn.classList.remove('bg-[#fdfbf7]', 'shadow-xs');
                    btn.classList.add('hover:bg-[#fdfbf7]/60');
                    view.classList.add('hidden');
                }
            });

            if (tabName === 'timeline') {
                openStoryStage();
            } else {
                closeStoryStage();
            }

            lucide.createIcons();
        }

        function getSortedTimelineItems() {
            return markersData.filter(m => formatDateString(m.date) && m.in_timeline !== 'no').sort((a, b) => {
                const dateA = formatDateString(a.date);
                const dateB = formatDateString(b.date);
                if (dateA === dateB) return (a.order || 0) - (b.order || 0);
                return dateA.localeCompare(dateB);
            });
        }

        async function toggleItemTimelineStatus(id) {
            if (!isEditMode) return;
            const item = markersData.find(m => m.id === id);
            if (!item) return;

            item.in_timeline = (item.in_timeline === 'no') ? 'yes' : 'no';

            if (gasUrl) {
                try {
                    await fetch(gasUrl, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'save', data: item })
                    });
                } catch(e) { console.error(e); }
            }

            renderTimeline();
        }

        function updateTimelineHighlight(id) {
            document.querySelectorAll('.timeline-item').forEach(el => {
                el.classList.remove('active-timeline-item');
                el.classList.add('bg-white/40');
            });
            const tlEl = document.getElementById(`tl_item_${id}`);
            if (tlEl) {
                tlEl.classList.remove('bg-white/40');
                tlEl.classList.add('active-timeline-item');
                tlEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            container.innerHTML = '';

            const sortedItems = markersData.filter(m => {
                if (!formatDateString(m.date)) return false;
                if (!isEditMode && m.in_timeline === 'no') return false;
                return true;
            }).sort((a, b) => {
                const dateA = formatDateString(a.date);
                const dateB = formatDateString(b.date);
                if (dateA === dateB) return (a.order || 0) - (b.order || 0);
                return dateA.localeCompare(dateB);
            });

            if (sortedItems.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-4">尚無設定日期的地點回憶...</div>';
                return;
            }

            let timelineHtml = '<div class="absolute left-3 top-2 bottom-2 w-0.5 bg-[#ddc8b4]/60 pointer-events-none"></div>';

            sortedItems.forEach((item) => {
                const cleanDate = formatDateString(item.date);
                const isHidden = item.in_timeline === 'no';
                const cardStyle = isHidden ? 'opacity-40 bg-slate-200/60 grayscale' : 'bg-white/40';

                const toggleBtn = isEditMode ? `
                    <button onclick="event.stopPropagation(); toggleItemTimelineStatus('${item.id}')" title="${isHidden ? '點擊取消隱藏（加入時間軸）' : '點擊隱藏（不進入時間軸）'}" class="p-1 rounded hover:bg-slate-200/80 transition text-slate-500 mr-1">
                        <i data-lucide="${isHidden ? 'eye-off' : 'eye'}" class="w-3.5 h-3.5 ${isHidden ? 'text-slate-500' : 'text-emerald-600'}"></i>
                    </button>
                ` : '';

                timelineHtml += `
                    <div data-id="${item.id}" id="tl_item_${item.id}" class="timeline-item btn-interactive relative pl-7 pr-2 py-2 rounded-r-lg border-l-2 border-transparent ${cardStyle} mb-1.5 flex items-center justify-between group">
                        <div onclick="focusPlace('${item.lat}', '${item.lng}', '${item.id}')" class="flex-1 cursor-pointer overflow-hidden">
                            <div class="absolute left-[9px] top-3.5 w-2 h-2 rounded-full ${isHidden ? 'bg-slate-400' : 'bg-[#7f5539]'} ring-4 ring-[#f4ebe1]"></div>
                            <div class="text-[10px] ${isHidden ? 'text-slate-500' : 'text-pink-600'} font-bold flex items-center gap-1">
                                <i data-lucide="calendar" class="w-2.5 h-2.5"></i> ${cleanDate}
                                ${isHidden ? '<span class="text-[9px] bg-slate-300 text-slate-600 px-1 rounded ml-1 font-normal">已隱藏</span>' : ''}
                            </div>
                            <div class="text-xs ${isHidden ? 'text-slate-500 line-through' : 'text-slate-800'} leading-snug flex items-baseline gap-1.5 mt-0.5">
                                <span class="font-bold shrink-0 text-sm md:text-xs">${item.title}</span>
                                <span class="text-[10px] text-slate-500 flex items-center gap-0.5 truncate font-normal">
                                    ${iconEmojiMap[item.icon] || '📍'} ${item.location || ''}
                                </span>
                            </div>
                            ${item.notes ? `<div class="text-[10px] text-slate-400 line-clamp-1 mt-0.5">${item.notes}</div>` : ''}
                        </div>
                        <div class="flex items-center gap-1">
                            ${toggleBtn}
                            <i data-lucide="menu" class="w-3.5 h-3.5 text-slate-400 ${isEditMode ? 'cursor-grab active:cursor-grabbing' : 'opacity-0 pointer-events-none'} ml-1"></i>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = timelineHtml;
            lucide.createIcons();

            if (timelineSortable) timelineSortable.destroy();
            timelineSortable = Sortable.create(container, {
                animation: 180,
                ghostClass: 'sortable-ghost',
                chosenClass: 'sortable-chosen',
                handle: '.cursor-grab',
                disabled: !isEditMode,
                onEnd: async function () {
                    if (!isEditMode) return;
                    const reorderedIds = Array.from(container.children).map(el => el.getAttribute('data-id')).filter(Boolean);
                    
                    for (let i = 0; i < reorderedIds.length; i++) {
                        const matchedItem = markersData.find(m => m.id === reorderedIds[i]);
                        if (matchedItem) {
                            matchedItem.order = i * 10; 
                            
                            if (gasUrl) {
                                fetch(gasUrl, {
                                    method: 'POST', mode: 'no-cors',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ action: 'save', data: matchedItem })
                                }).catch(e => console.error(e));
                            }
                        }
                    }
                    markersData.sort((a, b) => (a.order || 0) - (b.order || 0));
                }
            });
        }

        function openStoryStage() {
            document.getElementById('storyStage').classList.remove('hidden');
            showCurrentTimelineStep(true);
        }

        function closeStoryStage() {
            pauseTimelinePlayback();
            document.getElementById('storyStage').classList.add('hidden');
        }

        function toggleTimelinePlayback() {
            if (playbackState === 'playing') {
                pauseTimelinePlayback();
            } else if (playbackState === 'paused') {
                resumeTimelinePlayback();
            } else {
                startTimelinePlayback();
            }
        }

        function updatePlaybackButtonUI(state) {
            const btn = document.getElementById('btnPlayTimeline');
            if (!btn) return;
            if (state === 'playing') {
                btn.innerHTML = '暫停';
            } else {
                btn.innerHTML = '播放';
            }
        }

        function startTimelinePlayback() {
            openStoryStage();
            playbackState = 'playing';
            updatePlaybackButtonUI('playing');
            
            const sortedItems = getSortedTimelineItems();
            if (currentPlaybackItemIndex < 0 || currentPlaybackItemIndex >= sortedItems.length) {
                currentPlaybackItemIndex = 0;
            }

            runPlaybackLoop();
        }

        function resumeTimelinePlayback() {
            openStoryStage();
            playbackState = 'playing';
            updatePlaybackButtonUI('playing');
            runPlaybackLoop();
        }

        function pauseTimelinePlayback() {
            playbackState = 'paused';
            if (playbackTimer) clearTimeout(playbackTimer);
            updatePlaybackButtonUI('paused');
        }

        function stopTimelinePlayback(isEnded = false) {
            playbackState = isEnded ? 'ended' : 'stopped';
            if (playbackTimer) clearTimeout(playbackTimer);
            updatePlaybackButtonUI(playbackState);
        }

        window.jumpToItem = function(itemId) {
            const sortedItems = getSortedTimelineItems();
            const targetIndex = sortedItems.findIndex(m => m.id === itemId);
            if (targetIndex !== -1) {
                if (playbackState === 'playing') pauseTimelinePlayback();
                currentPlaybackItemIndex = targetIndex;
                currentPlaybackImgIndex = 0;
                showCurrentTimelineStep(true);
            }
        };

        function renderOverviewTrack(sortedItems, currentItem) {
            if (!sortedItems || sortedItems.length === 0) return;

            const monthSet = new Set();
            sortedItems.forEach(item => {
                const dStr = formatDateString(item.date);
                if (dStr && dStr.length >= 7) {
                    monthSet.add(dStr.slice(0, 7));
                }
            });

            const uniqueMonths = Array.from(monthSet).sort();
            if (uniqueMonths.length === 0) return;

            const totalMonths = uniqueMonths.length;

            const ticksBox = document.getElementById('timelineMonthTicks');
            if (ticksBox) {
                ticksBox.innerHTML = uniqueMonths.map((ym, idx) => {
                    const pct = (idx / totalMonths) * 100;
                    const parts = ym.split('-');
                    const ymLabel = `${parts[0].slice(2)}/${parts[1]}`;

                    return `
                        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none" style="left: ${pct}%;">
                            <div class="w-[1.5px] h-3 bg-white/30"></div>
                            <span class="text-[9px] font-mono text-slate-300 tracking-tight select-none mt-1.5 drop-shadow">${ymLabel}</span>
                        </div>
                    `;
                }).join('');
            }

            const dateGroups = {};
            sortedItems.forEach(item => {
                const dStr = formatDateString(item.date);
                if (!dStr) return;
                if (!dateGroups[dStr]) dateGroups[dStr] = [];
                dateGroups[dStr].push(item);
            });

            let nodesHtml = '';
            let activeItemPos = { pct: 0, offsetY: 0 };
            const yPattern = [0, -3, 3, -2, 2];

            sortedItems.forEach((item) => {
                const dStr = formatDateString(item.date);
                if (!dStr) return;

                const parts = dStr.split('-');
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10);
                const day = parseInt(parts[2], 10);
                const ymKey = `${year}-${String(month).padStart(2, '0')}`;

                const mIdx = uniqueMonths.indexOf(ymKey);
                if (mIdx === -1) return;

                const group = dateGroups[dStr] || [item];
                const itemIndexInDay = group.indexOf(item);
                const countInDay = group.length;

                const daysInMonth = new Date(year, month, 0).getDate();

                const mStartPct = (mIdx / totalMonths) * 100;
                const mWidthPct = 100 / totalMonths;

                const dayFraction = (day - 1 + (itemIndexInDay / Math.max(1, countInDay))) / daysInMonth;
                let pct = mStartPct + (mWidthPct * dayFraction);
                pct = Math.max(0, Math.min(100, pct));

                const offsetY = yPattern[itemIndexInDay % yPattern.length];
                const isCurrent = (item.id === currentItem.id);

                if (isCurrent) {
                    activeItemPos = { pct, offsetY };
                }

                nodesHtml += `
                    <div onclick="jumpToItem('${item.id}')" 
                         class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 cursor-pointer group z-10 p-1 transition-transform hover:scale-150" 
                         style="left: ${pct}%; transform: translate(-50%, calc(-50% + ${offsetY}px));" 
                         title="${dStr} - ${item.title}">
                        <div class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${isCurrent ? 'bg-pink-400 ring-2 ring-pink-300 shadow-[0_0_8px_#f472b6] scale-125' : 'bg-amber-300/85 group-hover:bg-pink-300'}"></div>
                    </div>
                `;
            });

            const nodesBox = document.getElementById('timelineDateNodes');
            if (nodesBox) nodesBox.innerHTML = nodesHtml;

            const cursor = document.getElementById('timelineActiveCursor');
            if (cursor) {
                cursor.style.left = `${activeItemPos.pct}%`;
                cursor.style.transform = `translate(-50%, calc(-50% + ${activeItemPos.offsetY}px))`;
                
                cursor.classList.remove('animate-heartbeat');
                void cursor.offsetWidth;
                cursor.classList.add('animate-heartbeat');
            }
        }

        function showCurrentTimelineStep(isNewLocation = true) {
            const sortedItems = getSortedTimelineItems();
            if (sortedItems.length === 0) return;

            if (currentPlaybackItemIndex < 0) currentPlaybackItemIndex = 0;
            if (currentPlaybackItemIndex >= sortedItems.length) currentPlaybackItemIndex = sortedItems.length - 1;

            const item = sortedItems[currentPlaybackItemIndex];
            const cleanDate = formatDateString(item.date);

            renderOverviewTrack(sortedItems, item);

            // 1. 解析多媒體列表 (照片 + 影片)
            const rawImages = parseImageUrls(item.image_url);
            const videoUrl = item.video_url ? item.video_url.trim() : '';
            const mediaList = [];
            rawImages.forEach(img => mediaList.push({ type: 'image', url: img }));
            if (videoUrl) mediaList.push({ type: 'video', url: videoUrl });

            if (currentPlaybackImgIndex >= mediaList.length) currentPlaybackImgIndex = 0;

            // 2. 更新頂部標題
            document.getElementById('storyHeaderIcon').innerText = iconEmojiMap[item.icon] || '📍';
            
            const locationSpan = item.location 
                ? `<span class="text-xs md:text-sm font-normal text-slate-300 truncate font-rounded">📍 ${item.location}</span>` 
                : '';
                
            document.getElementById('storyHeaderTitle').innerHTML = `
                <span class="text-base md:text-lg font-extrabold text-white tracking-wide font-rounded drop-shadow-md shrink-0">${item.title || '手帳主旨'}</span>
                ${locationSpan}
            `;

            // 3. 生成標題後方的半透明小圓點
            const dotsBox = document.getElementById('storyHeaderDots');
            if (mediaList.length > 1) {
                dotsBox.classList.remove('hidden');
                dotsBox.innerHTML = mediaList.map((_, idx) => {
                    const isActive = (idx === currentPlaybackImgIndex);
                    return `<span class="w-2 h-2 rounded-full transition-all duration-300 ${isActive ? 'bg-pink-400 scale-125 shadow-[0_0_8px_#f472b6]' : 'bg-white/30'}"></span>`;
                }).join('');
            } else {
                dotsBox.classList.add('hidden');
            }

            const mediaBox = document.getElementById('storyMediaBox');
            const mediaContent = document.getElementById('storyMediaContent');
            const bgBlur = document.getElementById('storyBgBlur');

            // 4. 渲染媒體內容
            if (mediaList.length === 0) {
                bgBlur.style.backgroundImage = 'none';
                bgBlur.style.backgroundColor = '#0f172a';
                mediaContent.innerHTML = `<div class="text-xs text-slate-400">尚無上傳照片...</div>`;
            } else {
                const activeMedia = mediaList[currentPlaybackImgIndex];
                
                if (activeMedia.type === 'image') {
                    const safeImgUrl = convertGoogleDriveLink(activeMedia.url);
                    bgBlur.style.backgroundImage = `url('${safeImgUrl}')`;
                    mediaContent.innerHTML = `
                        <img src="${safeImgUrl}" class="w-full h-full object-contain pointer-events-none" onerror="this.src='https://via.placeholder.com/600x800?text=圖片載入中/未公開'">
                    `;
                } else {
                    bgBlur.style.backgroundImage = 'none';
                    bgBlur.style.backgroundColor = '#0f172a';
                    mediaContent.innerHTML = getVideoEmbedHtml(activeMedia.url);
                }
            }

            // 5. 動畫切換處理
            if (isNewLocation) {
                mediaBox.classList.remove('animate-location-shift', 'animate-photo-fade');
                void mediaBox.offsetWidth;
                mediaBox.classList.add('animate-location-shift');

                const bubble = document.getElementById('storyBubble');
                bubble.classList.remove('animate-bubble-pop');
                void bubble.offsetWidth;
                bubble.classList.add('animate-bubble-pop');
            } else {
                mediaContent.classList.remove('animate-photo-fade');
                void mediaContent.offsetWidth;
                mediaContent.classList.add('animate-photo-fade');
            }

            // 6. 🌟 變更 2：對話氣泡內容更新 (日期前移、集合放大，無地點)
            document.getElementById('storyBubbleDate').innerText = cleanDate ? `📅 ${cleanDate}` : '';
            document.getElementById('storyBubbleFolder').innerText = item.folder_name || '我們的旅程';
            document.getElementById('storyBubbleNotes').innerText = item.notes ? item.notes : '這一天也留下了甜甜的回憶～ (´∀`)';

            updateTimelineHighlight(item.id);
            lucide.createIcons();
        }

        function nextTimelinePhoto() {
            const sortedItems = getSortedTimelineItems();
            if (sortedItems.length === 0) return;

            if (playbackState === 'playing') pauseTimelinePlayback();

            const item = sortedItems[currentPlaybackItemIndex];
            const rawImages = parseImageUrls(item ? item.image_url : '');
            const hasVideo = item && item.video_url && item.video_url.trim() ? 1 : 0;
            const totalMedia = rawImages.length + hasVideo;

            currentPlaybackImgIndex++;
            let isNewLocation = false;

            if (currentPlaybackImgIndex >= Math.max(1, totalMedia)) {
                currentPlaybackItemIndex++;
                currentPlaybackImgIndex = 0;
                isNewLocation = true;
                if (currentPlaybackItemIndex >= sortedItems.length) {
                    currentPlaybackItemIndex = 0;
                }
            }

            showCurrentTimelineStep(isNewLocation);
        }

        function prevTimelinePhoto() {
            const sortedItems = getSortedTimelineItems();
            if (sortedItems.length === 0) return;

            if (playbackState === 'playing') pauseTimelinePlayback();

            currentPlaybackImgIndex--;
            let isNewLocation = false;

            if (currentPlaybackImgIndex < 0) {
                currentPlaybackItemIndex--;
                isNewLocation = true;
                if (currentPlaybackItemIndex < 0) {
                    currentPlaybackItemIndex = sortedItems.length - 1;
                }
                const prevItem = sortedItems[currentPlaybackItemIndex];
                const prevRawImages = parseImageUrls(prevItem ? prevItem.image_url : '');
                const prevHasVideo = prevItem && prevItem.video_url && prevItem.video_url.trim() ? 1 : 0;
                const prevTotalMedia = prevRawImages.length + prevHasVideo;
                currentPlaybackImgIndex = Math.max(0, prevTotalMedia - 1);
            }

            showCurrentTimelineStep(isNewLocation);
        }

        function runPlaybackLoop() {
            if (playbackState !== 'playing') return;

            const sortedItems = getSortedTimelineItems();
            if (currentPlaybackItemIndex >= sortedItems.length) {
                stopTimelinePlayback(true);
                return;
            }

            const item = sortedItems[currentPlaybackItemIndex];
            const rawImages = parseImageUrls(item.image_url);
            const hasVideo = item.video_url && item.video_url.trim() ? 1 : 0;
            const totalMedia = rawImages.length + hasVideo;

            playbackTimer = setTimeout(() => {
                if (playbackState !== 'playing') return;

                currentPlaybackImgIndex++;
                let isNewLocation = false;

                if (currentPlaybackImgIndex >= Math.max(1, totalMedia)) {
                    currentPlaybackItemIndex++;
                    currentPlaybackImgIndex = 0;
                    isNewLocation = true;
                }

                if (currentPlaybackItemIndex >= sortedItems.length) {
                    stopTimelinePlayback(true);
                    return;
                }

                showCurrentTimelineStep(isNewLocation);
                runPlaybackLoop();
            }, playbackDelay * 1000);
        }

        function renderGallery() {
            const container = document.getElementById('galleryContainer');
            container.innerHTML = '';

            const photoItems = markersData.filter(m => m.image_url && parseImageUrls(m.image_url).length > 0);

            if (photoItems.length === 0) {
                container.innerHTML = '<div class="text-xs text-slate-400 text-center py-6">尚未上傳相片...</div>';
                return;
            }

            photoItems.sort((a, b) => {
                const dateA = formatDateString(a.date) || '9999-99-99';
                const dateB = formatDateString(b.date) || '9999-99-99';
                if (dateA === dateB) return (a.order || 0) - (b.order || 0);
                return dateA.localeCompare(dateB);
            });

            let cardsHtml = `<div class="grid grid-cols-2 gap-2">`;

            photoItems.forEach(item => {
                const rawImages = parseImageUrls(item.image_url);
                if (rawImages.length === 0) return;

                const firstSafeImg = convertGoogleDriveLink(rawImages[0]);
                const cleanDate = formatDateString(item.date);

                cardsHtml += `
                    <div onclick="focusPlace('${item.lat}', '${item.lng}', '${item.id}')" class="polaroid-card btn-interactive rounded-xl cursor-pointer select-none flex flex-col relative border border-slate-200/80 p-2 bg-white shadow-xs">
                        <div class="relative w-full h-24 md:h-28 bg-slate-100 rounded-lg overflow-hidden mb-1.5 shadow-inner">
                            ${rawImages.length > 1 ? `<span class="absolute top-1 right-1 bg-black/60 text-white text-[8px] px-1.5 py-0.5 rounded-full z-10 font-bold">📸 ${rawImages.length}</span>` : ''}
                            ${cleanDate ? `<span class="absolute bottom-1 right-1 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded z-10 font-mono">${cleanDate}</span>` : ''}
                            <img src="${firstSafeImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=圖片載入中/未公開'">
                        </div>
                        <div class="text-xs font-bold text-slate-800 line-clamp-1 leading-snug">${item.title}</div>
                        <div class="text-[10px] text-slate-500 mt-0.5 flex items-center gap-1 line-clamp-1">
                            <span>${iconEmojiMap[item.icon] || '📍'}</span>
                            <span class="truncate">${item.location || ''}</span>
                        </div>
                    </div>
                `;
            });

            cardsHtml += `</div>`;
            container.innerHTML = cardsHtml;
            lucide.createIcons();
        }

        function renderSidebar() {
            const container = document.getElementById('folderContainer');
            container.innerHTML = '';
            
            const allFolders = Array.from(new Set([...folders, ...markersData.map(m => m.folder_name).filter(Boolean)]));

            allFolders.forEach(folderName => {
                const folderItems = markersData.filter(m => m.folder_name === folderName);
                
                const isDefault = folderName === '行程總覽';
                const actionButtons = (isDefault || !isEditMode) ? '' : `
                    <div class="flex gap-1.5 opacity-40 hover:opacity-100 transition ml-auto">
                        <button onclick="event.stopPropagation(); renameFolder('${folderName}')" title="重命名" class="hover:text-blue-600 p-0.5"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i></button>
                        <button onclick="event.stopPropagation(); deleteFolder('${folderName}')" title="刪除" class="hover:text-red-600 p-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                `;

                const folderId = 'folder_' + btoa(encodeURIComponent(folderName)).replace(/=/g, '');

                const folderDiv = document.createElement('div');
                folderDiv.className = "bg-[#f5ebe0]/80 rounded-xl p-2.5 border border-[#ddc8b4]/80 mb-2 shadow-xs";
                folderDiv.innerHTML = `
                    <div class="font-bold text-xs text-[#7f5539] flex items-center gap-1.5 mb-1.5 select-none">
                        <i data-lucide="folder" class="w-3.5 h-3.5 text-[#b7b7a4]"></i> 
                        <span class="text-xs md:text-xs font-bold">${folderName} (${folderItems.length})</span>
                        ${actionButtons}
                    </div>
                    <div id="${folderId}" class="sortable-list space-y-1.5 min-h-[10px]">
                        ${folderItems.map(item => `
                            <div data-id="${item.id}" class="sortable-item btn-interactive text-xs bg-white p-2 rounded-lg cursor-pointer hover:bg-[#f5ebe0] text-slate-800 flex justify-between items-center transition border border-slate-200/60 shadow-2xs">
                                <span onclick="focusPlace('${item.lat}', '${item.lng}', '${item.id}')" class="flex items-center gap-1.5 font-medium flex-1 overflow-hidden">
                                    <span style="color: ${colorMap[item.color] || '#3b82f6'}" class="shrink-0">●</span>
                                    <span class="font-bold text-slate-800 shrink-0 text-xs">${item.title}</span>
                                    <span class="text-[10px] text-slate-500 flex items-center gap-0.5 truncate">
                                        ${iconEmojiMap[item.icon] || '📍'} ${item.location || ''}
                                    </span>
                                </span>
                                <i data-lucide="menu" class="w-3.5 h-3.5 text-slate-300 ${isEditMode ? 'cursor-grab active:cursor-grabbing' : 'opacity-0 pointer-events-none'} ml-2"></i>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(folderDiv);

                const listEl = document.getElementById(folderId);
                if (listEl) {
                    Sortable.create(listEl, {
                        animation: 180,
                        ghostClass: 'sortable-ghost',
                        chosenClass: 'sortable-chosen',
                        handle: '.cursor-grab', 
                        disabled: !isEditMode, 
                        onEnd: async function () {
                            if (!isEditMode) return;
                            const reorderedIds = Array.from(listEl.children).map(el => el.getAttribute('data-id'));
                            
                            for (let i = 0; i < reorderedIds.length; i++) {
                                const matchedItem = markersData.find(m => m.id === reorderedIds[i]);
                                if (matchedItem) {
                                    matchedItem.order = i * 10; 
                                    
                                    if (gasUrl) {
                                        fetch(gasUrl, {
                                            method: 'POST', mode: 'no-cors',
                                            headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ action: 'save', data: matchedItem })
                                        }).catch(e => console.error(e));
                                    }
                                }
                            }
                            markersData.sort((a, b) => (a.order || 0) - (b.order || 0));
                        }
                    });
                }
            });
            lucide.createIcons();
        }

        function focusPlace(lat, lng, id) {
            const targetLat = parseFloat(lat);
            const targetLng = parseFloat(lng);

            const sortedItems = getSortedTimelineItems();
            const foundIdx = sortedItems.findIndex(m => m.id === id);
            if (foundIdx !== -1) {
                currentPlaybackItemIndex = foundIdx;
                currentPlaybackImgIndex = 0;
            }

            const isTimelineTabActive = !document.getElementById('viewTimeline').classList.contains('hidden');
            if (isTimelineTabActive) {
                openStoryStage();
            } else if (!isNaN(targetLat) && !isNaN(targetLng)) {
                closeStoryStage();
                const locKey = getLocKey(targetLat, targetLng);
                const marker = locKey ? markerInstances[locKey] : null;

                if (marker) {
                    marker.addTo(map);
                    const targetLatLng = L.latLng(targetLat, targetLng);
                    const targetZoom = Math.max(map.getZoom(), 15);
                    const targetPoint = map.project(targetLatLng, targetZoom);
                    const offsetPoint = L.point(targetPoint.x, targetPoint.y - 120); 
                    const centerLatLng = map.unproject(offsetPoint, targetZoom);

                    map.setView(centerLatLng, targetZoom, { animate: true, duration: 0.5 });

                    const groups = getGroupedItems();
                    const items = groups[locKey] || [];
                    showItemDetailInPopup(locKey, id, items.length > 1, 0);
                }
            }

            updateTimelineHighlight(id);

            const item = markersData.find(m => m.id === id);
            if (isEditMode && item) {
                openEditPanelForItem(item);
            }
        }

        function toggleAuthMode() {
            if (!isEditMode) {
                const password = prompt("請輸入管理員密碼以開啟編輯權限：");
                if (password === "20250214") {
                    isEditMode = true;
                    alert("認證成功！已切換至【編輯模式】。");
                } else if (password !== null) {
                    alert("密碼錯誤，拒絕存取！");
                    return;
                } else {
                    return;
                }
            } else {
                isEditMode = false;
                closePanel();
                alert("已登出，安全切換回【觀看模式】。");
            }
            applyAuthDOMChanges();
        }

        function applyAuthDOMChanges() {
            const btnCreate = document.getElementById('btnCreateFolder');
            const authIcon = document.getElementById('authIcon');
            const authText = document.getElementById('authText');
            const btnToggle = document.getElementById('btnToggleAuth');

            map.closePopup();

            if (isEditMode) {
                btnCreate.disabled = false;
                authText.innerText = "編輯模式";
                authIcon.setAttribute('data-lucide', 'lock-open');
                btnToggle.className = "w-full text-xs bg-emerald-600 hover:bg-emerald-700 text-white py-1.5 md:py-2 rounded-md font-medium transition shadow-sm flex items-center justify-center gap-1.5";
            } else {
                btnCreate.disabled = true;
                authText.innerText = "觀看模式";
                authIcon.setAttribute('data-lucide', 'eye');
                btnToggle.className = "w-full text-xs bg-[#7f5539] hover:bg-[#9c6644] text-white py-1.5 md:py-2 rounded-md font-medium transition shadow-sm flex items-center justify-center gap-1.5";
                closePanel();
            }
            
            renderSidebar();
            renderTimeline();
            renderGallery();
            lucide.createIcons();
        }

        setInterval(() => {
            const isPopupOpen = map._popup && map.hasLayer(map._popup);
            const isEditPanelOpen = !document.getElementById('editPanel').classList.contains('hidden');

            if (!isPopupOpen && !isEditPanelOpen && !document.querySelector('.sortable-chosen') && playbackState !== 'playing') {
                fetchCloudData();
            }
        }, 8000);

        if (gasUrl) fetchCloudData();
        applyAuthDOMChanges();
    </script>
</body>
