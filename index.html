<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <title>質感生活同步互動地圖 - 回憶手帳版</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

    <!-- Google 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .font-rounded { font-family: 'M PLUS Rounded 1c', 'Noto Sans TC', sans-serif; }

        button, .btn-interactive {
            touch-action: manipulation;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1) !important;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        button:active, .btn-interactive:active {
            transform: scale(0.94) !important;
            opacity: 0.85 !important;
        }

        /* 觸控順暢滑動優化 */
        .touch-scroll {
            touch-action: pan-y !important;
            -webkit-overflow-scrolling: touch !important;
            overscroll-behavior-y: contain;
        }

        /* 軟木相片牆背景 */
        .corkboard-bg {
            background-color: #cb9b51;
            background-image: 
                radial-gradient(rgba(120, 75, 30, 0.22) 15%, transparent 16%),
                radial-gradient(rgba(90, 50, 15, 0.22) 15%, transparent 16%);
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
        }

        /* 3D 翻轉卡片效果 */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { 
            backface-visibility: hidden !important; 
            -webkit-backface-visibility: hidden !important; 
        }
        .flip-card-inner { 
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); 
            transform-style: preserve-3d;
        }
        .flip-card-inner.is-flipped { transform: rotateY(180deg); }

        /* 地圖標記粉色脈衝光暈動效 */
        @keyframes pinkPulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(244, 114, 182, 0.9)); }
            50% { transform: scale(1.3); filter: drop-shadow(0 0 16px rgba(244, 114, 182, 1)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(244, 114, 182, 0.9)); }
        }
        .marker-pink-pulse {
            animation: pinkPulseGlow 1.2s infinite ease-in-out !important;
            z-index: 1000 !important;
        }

        /* 3D 擬真信封樣式 */
        .envelope-top-flap {
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top center;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.2s;
            z-index: 25 !important;
        }
        .envelope-pocket-front {
            clip-path: polygon(0 0, 50% 45%, 100% 0, 100% 100%, 0 100%);
            z-index: 20 !important;
        }

        /* 信紙視覺 */
        .vintage-letter-paper {
            background-color: #fcf9f2 !important;
            border: 1px solid #d4c5b2;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.25);
            position: relative;
            opacity: 1 !important;
        }

        .letter-kraft-paper {
            background-color: #e2ceb1 !important;
            border: 1px solid #bd9c71;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
            opacity: 1 !important;
        }

        .letter-locked-paper {
            background-color: #eee7dc !important;
            border: 1px solid #c7bba8;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            opacity: 1 !important;
        }

        .letter-lace-border {
            border: 2px dashed #b89b72;
            border-radius: 8px;
            padding: 8px;
        }

        .letter-dashed-lines {
            background-image: linear-gradient(to bottom, transparent 23px, #c3a886 24px, transparent 25px);
            background-size: 100% 25px;
        }

        /* 紙張三階段動態 */
        .paper-card {
            pointer-events: none;
            transition: transform 0.45s cubic-bezier(0.34, 1.45, 0.64, 1), box-shadow 0.3s ease;
            transform-origin: bottom center;
            z-index: 5 !important;
        }

        .envelope-flap-open .envelope-top-flap {
            transform: rotateX(180deg);
            z-index: 1 !important;
        }

        .envelope-papers-out .paper-card {
            pointer-events: auto;
            z-index: 30 !important;
        }
        
        .envelope-papers-out .paper-1 { transform: translateY(-125px) rotate(6deg) translateX(42px) scale(0.98); }
        .envelope-papers-out .paper-2 { transform: translateY(-110px) rotate(-2deg) translateX(-15px) scale(0.98); }
        .envelope-papers-out .paper-3 { transform: translateY(-90px) rotate(-12deg) translateX(-75px) scale(0.94); }

        .envelope-papers-out .paper-1.active-paper {
            transform: translateY(-160px) rotate(6deg) translateX(42px) scale(1.03) !important;
            z-index: 60 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
        }
        .envelope-papers-out .paper-2.active-paper {
            transform: translateY(-145px) rotate(-2deg) translateX(-15px) scale(1.03) !important;
            z-index: 60 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
        }
        .envelope-papers-out .paper-3.active-paper {
            transform: translateY(-125px) rotate(-12deg) translateX(-75px) scale(0.98) !important;
            z-index: 60 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4) !important;
        }

        @keyframes bubblePop {
            0% { transform: scale(0.85) translateY(8px); opacity: 0; }
            70% { transform: scale(1.02) translateY(-2px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-bubble-pop {
            animation: bubblePop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes photoFade {
            0% { opacity: 0.3; transform: scale(0.985); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-photo-fade {
            animation: photoFade 0.22s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes locationShift {
            0% { opacity: 0; transform: translateX(35px) scale(0.96); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }
        .animate-location-shift {
            animation: locationShift 0.38s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            30% { transform: translate(-50%, -50%) scale(1.35); }
            60% { transform: translate(-50%, -50%) scale(0.92); }
            80% { transform: translate(-50%, -50%) scale(1.15); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        .animate-heartbeat {
            animation: heartbeat 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        #timelineActiveCursor {
            transition: left 0.38s cubic-bezier(0.34, 1.56, 0.64, 1), transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .leaflet-popup {
            min-width: 290px !important;
            max-width: 90vw !important;
        }
        .leaflet-popup-content-wrapper {
            background: transparent !important;
            padding: 0 !important;
            box-shadow: none !important;
            border: none !important;
        }
        .leaflet-popup-content {
            width: auto !important;
            margin: 0 !important;
        }

        .popup-notes {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .leaflet-control-geocoder {
            border: 1px solid #ddc8b4 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05) !important;
            border-radius: 0.5rem !important;
            background-color: #fdfbf7 !important;
        }

        /* 📸 拍立得卡片 (保留上方空間) */
        .polaroid-card {
            background: #fff;
            padding: 14px 6px 12px 6px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.18);
            transition: all 0.2s ease;
        }

        /* 左上角黃色便條紙：左側加長留白空間給圖釘，絕不擋到日期 */
        .date-note-paper-pinned {
            background: #fef08a;
            color: #854d0e;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 700;
            font-size: 11px;
            padding: 2px 7px 2px 18px;
            border-radius: 2px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 1px solid #fef9c3;
        }

        /* 擬真照片捲曲折角 */
        .real-curl-fold {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            cursor: pointer;
            z-index: 50;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        .real-curl-fold::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid;
            border-width: 0 0 32px 32px;
            border-color: transparent transparent #d1d5db transparent;
            filter: drop-shadow(-2px -2px 3px rgba(0,0,0,0.3));
        }
        .real-curl-fold::after {
            content: '↗';
            position: absolute;
            bottom: 3px;
            right: 3px;
            font-size: 11px;
            color: #374151;
            font-weight: bold;
            transform: rotate(-10deg);
            z-index: 60;
            pointer-events: none;
        }

        .timeline-item.active-timeline-item {
            background-color: #fdfbf7 !important;
            border-left: 4px solid #7f5539 !important;
            box-shadow: 0 4px 12px rgba(127, 85, 57, 0.15) !important;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#2b1c14] text-slate-700 h-[100dvh] w-screen flex flex-col md:flex-row font-sans relative overflow-hidden">

    <!-- 專屬獨立編輯面板 -->
    <div id="editPanel" class="hidden w-full md:w-80 bg-[#f4f7f4] p-4 border-t md:border-t-0 md:border-l border-emerald-300 md:h-full flex flex-col z-[1000] shadow-2xl">

                    <select id="placeIcon" class="w-full p-2 rounded-md bg-white border border-emerald-200 text-slate-800">
                        <option value="map-pin">📍 預設點</option>
                        <option value="footprints">👣 我們的足跡</option>
                        <option value="utensils">🍴 美食餐廳</option>
                        <option value="heart">💖 第一次/紀念</option>
                        <option value="calendar">📅 未來計畫</option>
                    </select>

                <label class="block text-xs font-medium text-slate-600 mb-1">圖片網址 (多張請用逗號 , 隔開)</label>
                <input type="text" id="placeImageUrl" class="w-full p-2 rounded-md bg-white border border-emerald-200 text-slate-800 focus:outline-none focus:border-emerald-600" placeholder="網址1, 網址2...">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">影片網址 (YouTube / Google Drive / MP4)</label>
                <input type="text" id="placeVideoUrl" class="w-full p-2 rounded-md bg-white border border-emerald-200 text-slate-800 focus:outline-none focus:border-emerald-600" placeholder="https://...">

                <label class="block text-xs font-medium text-slate-600 mb-1">筆記想法</label>
                <textarea id="placeNotes" rows="3" class="w-full p-2 rounded-md bg-white border border-emerald-200 text-slate-800 focus:outline-none focus:border-emerald-600"></textarea>

        <div class="pt-3 border-t border-emerald-200 flex gap-2 shrink-0">
            <button onclick="deleteMarker()" id="btnDelete" class="flex-1 py-2 bg-red-50 text-red-600 rounded-md hover:bg-red-100 transition font-medium text-sm">刪除</button>
            <button onclick="saveMarkerData()" class="flex-1 py-2 bg-emerald-600 text-white rounded-md hover:bg-emerald-700 transition font-medium text-sm shadow-sm">儲存同步</button>
        </div>
    </div>

    <script>
        const map = L.map('map').setView([23.6, 121.0], 7);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let isEnvelopeOpen = false;
        let mapConnectingPolyline = null;

        function toggleSettingsMenu() {
            const menu = document.getElementById('floatingSettingsMenu');
            menu.classList.toggle('hidden');
        }

        function toggle3DEnvelope() {
            const container = document.getElementById('envelopeContainer');
            const hint = document.getElementById('envelopeHint');
            isEnvelopeOpen = !isEnvelopeOpen;

            document.querySelectorAll('.paper-card').forEach(p => p.classList.remove('active-paper'));

            if (isEnvelopeOpen) {
                container.classList.add('envelope-flap-open');
                if (hint) hint.innerText = "撕開信封中...";

                setTimeout(() => {
                    container.classList.add('envelope-papers-out');
                    if (hint) hint.innerText = "請點擊感興趣的信紙 🌹";
                }, 350);
            } else {
                container.classList.remove('envelope-papers-out');
                setTimeout(() => {
                    container.classList.remove('envelope-flap-open');
                    if (hint) hint.innerText = "🌹 點擊撕開玫瑰信封";
                }, 300);
            }
        }

        function handlePaperClick(paperType, paperNum) {
            if (!isEnvelopeOpen) return;
            if (paperType === 'locked') return;

            const targetPaper = document.querySelector(`.paper-${paperNum}`);

            if (targetPaper.classList.contains('active-paper')) {
                selectViewPaper(paperType);
            } else {
                document.querySelectorAll('.paper-card').forEach(p => p.classList.remove('active-paper'));
                targetPaper.classList.add('active-paper');
            }
        }

        function selectViewPaper(paperType) {
            const coverStage = document.getElementById('viewCoverStage');
            const btnReturn = document.getElementById('btnReturnToEnvelope');
            
            coverStage.classList.add('opacity-0', 'pointer-events-none');

            setTimeout(() => {
                coverStage.classList.add('hidden');
                
                if (!isEditMode) {
                    btnReturn.classList.remove('hidden');
                }

                if (paperType === 'timeline') {
                    switchSidebarTab('timeline');
                } else if (paperType === 'gallery' || paperType === 'folders') {
                    switchSidebarTab(paperType);
                }
            }, 300);
        }

        function returnToEnvelope() {
            closeStoryStage();
            removeConnectingLine();
            const coverStage = document.getElementById('viewCoverStage');
            const btnReturn = document.getElementById('btnReturnToEnvelope');
            btnReturn.classList.add('hidden');
            coverStage.classList.remove('hidden');
            document.querySelectorAll('.paper-card').forEach(p => p.classList.remove('active-paper'));
            setTimeout(() => coverStage.classList.remove('opacity-0', 'pointer-events-none'), 10);
        }

        const CustomTaiwanGeocoder = {
            geocode: function(query) {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=zh-TW&limit=6`;
                
                return fetch(url)
                    .then(res => {
                        if (!res.ok) throw new Error("網路請求失敗");
                        return res.json();
                    })
                    .then(data => {
                        if (!data || data.length === 0) return [];

                        return data.map(item => {
                            let cleanName = item.display_name
                                .replace(/, 臺灣|, 中華民國/g, '')
                                .split(', ').reverse().join(' ').trim();

                            const lat = parseFloat(item.lat);
                            const lng = parseFloat(item.lon);

                            return {
                                name: cleanName,
                                center: L.latLng(lat, lng),
                                bounds: L.latLngBounds(
                                    [parseFloat(item.boundingbox[0]), parseFloat(item.boundingbox[2])],
                                    [parseFloat(item.boundingbox[1]), parseFloat(item.boundingbox[3])]
                                )
                            };
                        });
                    })
                    .catch((err) => {
                        console.error("全球搜尋發生錯誤:", err);
                        return [];
                    });
            }
        };

        const geocoder = L.Control.geocoder({
            geocoder: CustomTaiwanGeocoder,
            defaultMarkGeocode: false,
            placeholder: "搜尋全球景點、城市或台灣地址...",
            errorMessage: "找不到這個地點呢..."
        })
        .on('markgeocode', function(e) {
            if (!isEditMode) {
                const latlng = e.geocode.center;
                map.setView(latlng, 16);
                return;
            }

            const latlng = e.geocode.center;
            const name = e.geocode.name;
            
            map.setView(latlng, 16);
            
            activeId = null;
            currentLatLng = latlng;
            if (currentMarker) map.removeLayer(currentMarker);
            
            currentMarker = L.marker(latlng, { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
            
            openPanel(true);
            document.getElementById('placeTitle').value = name;
            document.getElementById('placeLocation').value = name;
            lucide.createIcons();
        })
        .addTo(map);

        let markersData = [];
        let markerInstances = {}; 
        let currentMarker = null;
        let activeId = null;
        let currentLatLng = null;

        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxfmcmztf5KUo9RUx_2zwIwuawdd5UBzQGA0jf2P6LDxFJG8izufuBRR0sZc_3KwIb5/exec';
        let gasUrl = localStorage.getItem('gasUrl') || DEFAULT_GAS_URL;
        
        let playbackDelay = parseFloat(localStorage.getItem('playbackDelay')) || 3.5; 
        
        let playbackState = 'stopped';
        let currentPlaybackItemIndex = 0;
        let currentPlaybackImgIndex = 0;

        let folders = JSON.parse(localStorage.getItem('mapFolders')) || ['行程總覽', '美食口袋名單', '住宿備忘'];
        let isEditMode = false;
        let isMobileListCollapsed = false;

        document.getElementById('gasUrlInput').value = gasUrl;

        const colorMap = { red: '#ef4444', blue: '#3b82f6', green: '#10b981', yellow: '#eab308', purple: '#a855f7' };

        const iconEmojiMap = {
            'map-pin': '📍',
            'footprints': '👣',
            'utensils': '🍴',
            'heart': '💖',
            'calendar': '📅'
        };

        function toggleMobileList(forceState = null) {
            const listWrapper = document.getElementById('listContentWrapper');
            const icon = document.getElementById('toggleListIcon');
            const text = document.getElementById('toggleListText');
            const sidebar = document.getElementById('sidebarPanel');

            if (forceState !== null) {
                isMobileListCollapsed = forceState;
            } else {
                isMobileListCollapsed = !isMobileListCollapsed;
            }

            if (isMobileListCollapsed) {
                listWrapper.classList.add('hidden');
                sidebar.classList.remove('max-h-[60dvh]');
                sidebar.classList.add('max-h-none');
                if (icon) icon.setAttribute('data-lucide', 'chevron-down');
                if (text) text.innerText = '展開列表';
            } else {
                listWrapper.classList.remove('hidden');
                sidebar.classList.add('max-h-[60dvh]');
                if (icon) icon.setAttribute('data-lucide', 'chevron-up');
                if (text) text.innerText = '收起列表';
            }
            lucide.createIcons();
            setTimeout(() => map.invalidateSize(), 300);
        }

        function getLocKey(lat, lng) {
            const nLat = parseFloat(lat);
            const nLng = parseFloat(lng);
            if (isNaN(nLat) || isNaN(nLng)) return null;
            return `${nLat.toFixed(5)},${nLng.toFixed(5)}`;
        }

        function getGroupedItems() {
            const groups = {};
            markersData.forEach(item => {
                const key = getLocKey(item.lat, item.lng);
                if (!key) return;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });
            return groups;
        }

        function parseImageUrls(rawStr) {
            if (!rawStr) return [];
            return String(rawStr)
                .split(/[,，\n]+/)
                .map(s => s.trim())
                .filter(Boolean);
        }

        function convertGoogleDriveLink(url) {
            if (!url) return '';
            url = String(url).trim();
            if (url.includes('drive.google.com')) {
                let id = '';
                if (url.includes('/file/d/')) {
                    id = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('id=')) {
                    id = url.split('id=')[1].split('&')[0];
                } else if (url.includes('/d/')) {
                    id = url.split('/d/')[1].split('/')[0];
                }
                if (id) {
                    return "https://lh3.googleusercontent.com/d/" + id;
                }
            }
            return url;
        }

        function getGoogleDriveOriginalLink(url) {
            return convertGoogleDriveLink(url);
        }

        function formatDateString(dateStr) {
            if (!dateStr) return '';
            let str = String(dateStr).trim();

            if (str.includes('T')) {
                let d = new Date(str);
                if (!isNaN(d.getTime())) {
                    let year = d.getFullYear();
                    let month = String(d.getMonth() + 1).padStart(2, '0');
                    let day = String(d.getDate()).padStart(2, '0');
                    return `${year}-${month}-${day}`;
                }
            }

            const match = str.match(/\d{4}-\d{2}-\d{2}/);
            if (match) {
                return match[0];
            }
            return str;
        }

        /* 🎥 修正影片內嵌介面，確保原生播放按鈕不被變形 */
        function getVideoEmbedHtml(url) {
            if (!url) return '';
            url = url.trim();

            let fileId = '';
            if (url.includes('drive.google.com')) {
                if (url.includes('/file/d/')) {
                    fileId = url.split('/file/d/')[1].split('/')[0];
                } else if (url.includes('id=')) {
                    fileId = url.split('id=')[1].split('&')[0];
                } else if (url.includes('/d/')) {
                    fileId = url.split('/d/')[1].split('/')[0];
                }
                if (fileId) {
                    return `<iframe class="w-full h-full min-h-[220px] rounded-lg border-0 z-20 pointer-events-auto" src="https://drive.google.com/file/d/${fileId}/preview" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                }
            }

            if (url.match(/\.(mp4|webm|ogg)($|\?)/i)) {
                return `<video class="w-full h-full max-h-full object-contain rounded-lg z-20 pointer-events-auto" controls playsinline webkit-playsinline preload="metadata">
                            <source src="${url}">
                        </video>`;
            }

            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0].split('/')[0];
            } else if (url.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(url).search);
                videoId = urlParams.get('v');
            } else if (url.includes('youtube.com/embed/')) {
                videoId = url.split('youtube.com/embed/')[1].split('?')[0];
            } else if (url.includes('youtube.com/shorts/')) {
                videoId = url.split('youtube.com/shorts/')[1].split('?')[0];
            }

            if (videoId) {
                return `<iframe class="w-full aspect-video rounded-lg z-20 pointer-events-auto border-0" src="https://www.youtube.com/embed/${videoId}?autoplay=0&playsinline=1&enablejsapi=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
            }

            return `<iframe class="w-full h-full rounded-lg z-20 pointer-events-auto border-0" src="${url}" frameborder="0" allow="fullscreen"></iframe>`;
        }

        function createCustomIcon(colorName, iconName) {
            const color = colorMap[colorName] || '#3b82f6';
            const emoji = iconEmojiMap[iconName] || '📍';
            
            const svgPinBg = `
                <svg width="36" height="36" viewBox="0 0 40 40" style="display:block; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));">
                    <path d="M20 2C13.1 2 7.5 7.6 7.5 14.5C7.5 23.2 20 37 20 37S32.5 23.2 32.5 14.5C32.5 7.6 26.9 2 20 2Z" fill="${color}"/>
                    <circle cx="20" cy="14.5" r="9" fill="white"/>
                </svg>
            `;

            return L.divIcon({
                html: `
                    <div style="position:relative; width:36px; height:36px;">
                        ${svgPinBg}
                        <div style="position:absolute; top:3px; left:0; width:36px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; pointer-events:none; user-select:none;">
                            ${emoji}
                        </div>
                    </div>
                `,
                className: 'custom-leaflet-icon-emoji',
                iconSize: [36, 36],
                iconAnchor: [18, 35]
            });
        }

        map.on('click', function(e) {
            removeConnectingLine();
            if (!isEditMode) return;
            if (e.originalEvent.target.id === 'map' || e.originalEvent.target.classList.contains('leaflet-container')) {
                activeId = null;
                currentLatLng = e.latlng;
                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker(e.latlng, { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
                openPanel(true);
                lucide.createIcons();
            }
        });

        window.addNewEntryAtLocation = function(locKey) {
            if (!isEditMode) {
                alert("請先解鎖【編輯模式】才能新增手帳喔！");
                return;
            }
            const parts = locKey.split(',');
            if (parts.length === 2) {
                const lat = parseFloat(parts[0]);
                const lng = parseFloat(parts[1]);
                activeId = null;
                currentLatLng = { lat, lng };
                if (currentMarker) map.removeLayer(currentMarker);
                currentMarker = L.marker([lat, lng], { icon: createCustomIcon('blue', 'map-pin') }).addTo(map);
                openPanel(true);
                lucide.createIcons();
            }
        };

        window.openEditPanelForItemById = function(itemId) {
            if (!isEditMode) return;
            const item = markersData.find(m => m.id === itemId);
            if (item) {
                openEditPanelForItem(item);
            }
        };

        function openEditPanelForItem(item) {
            if (!isEditMode || !item) return;
            
            activeId = item.id;
            currentLatLng = { lat: parseFloat(item.lat), lng: parseFloat(item.lng) };
            
            openPanel(false);
            
            document.getElementById('placeTitle').value = item.title || '';
            document.getElementById('placeLocation').value = item.location || '';
            document.getElementById('placeDate').value = formatDateString(item.date) || '';
            document.getElementById('placeNotes').value = item.notes || '';
            document.getElementById('placeImageUrl').value = item.image_url || '';

        async function fetchCloudData(showAlert = false) {
            if (!gasUrl) return;

            let cleanUrl = gasUrl.trim().split('?')[0];
            if (!cleanUrl) return;

            let targetUrl = cleanUrl + '?action=read&_t=' + Date.now();

            try {
                const res = await fetch(targetUrl, { method: 'GET', redirect: 'follow' });
                if (res.ok) {
                    const json = await res.json();
                    const listData = json.data || (Array.isArray(json) ? json : null);
                    if (listData) {
                        renderMapMarkers(listData);
                        if (showAlert) alert("✅ 連線成功！已成功同步雲端手帳。");
                        return;
                    }
                }
            } catch (e) {}

            try {
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(targetUrl);
                const res = await fetch(proxyUrl);
                if (res.ok) {
                    const proxyData = await res.json();
                    const json = JSON.parse(proxyData.contents);
                    const listData = json.data || (Array.isArray(json) ? json : null);
                    if (listData) {
                        renderMapMarkers(listData);
                        if (showAlert) alert("✅ 連線成功！已成功同步雲端手帳。");
                        return;
                    }
                }
            } catch (e) {}

            if (showAlert) {
                alert("❌ 連線失敗！請確認 GAS 網址結尾是否為 /exec，且部署權限設為所有人。");
            }
        }

        /* 🎯 智慧地圖置中（完美修復圖二：手機版卡片不會被擠到最上方） */
        function centerPopupOnMap(lat, lng) {
            const targetLat = parseFloat(lat);
            const targetLng = parseFloat(lng);
            if (isNaN(targetLat) || isNaN(targetLng)) return;

            const targetLatLng = L.latLng(targetLat, targetLng);
            const targetZoom = Math.max(map.getZoom(), 15);
            const targetPoint = map.project(targetLatLng, targetZoom);
            
            // 依據手機/電腦視窗動態調整向下偏移量，確保 370px 高的卡片正好處於螢幕垂直中央
            const isMobile = window.innerWidth < 768;
            const offsetY = isMobile ? 30 : -100;
            
            const popupCenterPoint = L.point(targetPoint.x, targetPoint.y - offsetY);
            const centerLatLng = map.unproject(popupCenterPoint, targetZoom);

            map.setView(centerLatLng, targetZoom, { animate: true, duration: 0.4 });
        }

        function drawConnectingLine(lat, lng) {
            removeConnectingLine();
            const targetLat = parseFloat(lat);
            const targetLng = parseFloat(lng);
            if (isNaN(targetLat) || isNaN(targetLng)) return;
            
            const pinLatLng = L.latLng(targetLat, targetLng);
            const targetZoom = map.getZoom();
            
            const pinPoint = map.project(pinLatLng, targetZoom);
            const cardBottomPoint = L.point(pinPoint.x, pinPoint.y - 45);
            const cardBottomLatLng = map.unproject(cardBottomPoint, targetZoom);

            mapConnectingPolyline = L.polyline([cardBottomLatLng, pinLatLng], {
                color: '#ff2a75',
                weight: 4,
                dashArray: '5, 8',
                opacity: 0.95
            }).addTo(map);
        }

        function removeConnectingLine() {
            if (mapConnectingPolyline) {
                map.removeLayer(mapConnectingPolyline);
                mapConnectingPolyline = null;
            }
        }

        function renderMapMarkers(data) {
            markersData = data || [];
            markersData.sort((a, b) => (a.order || 0) - (b.order || 0));

            map.eachLayer(layer => {
                if (layer instanceof L.Marker) map.removeLayer(layer);
            });
            markerInstances = {};

            const groups = getGroupedItems();

            Object.keys(groups).forEach(locKey => {
                const items = groups[locKey];
                if (!items || items.length === 0) return;
                const primaryItem = items[0];

                const lat = parseFloat(primaryItem.lat);
                const lng = parseFloat(primaryItem.lng);
                
                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return;

                try {
                    const marker = L.marker([lat, lng], { 
                        icon: createCustomIcon(primaryItem.color, primaryItem.icon) 
                    }).addTo(map);

                    markerInstances[locKey] = marker;

                    marker.on('click', () => {
                        closeStoryStage(); 
                        centerPopupOnMap(lat, lng);

                        document.querySelectorAll('.marker-pink-pulse').forEach(el => el.classList.remove('marker-pink-pulse'));
                        if (marker._icon) {
                            marker._icon.classList.add('marker-pink-pulse');
                        }

                        const currentGroups = getGroupedItems();
                        const currentItems = currentGroups[locKey] || [];
                        if (currentItems.length > 1) {
                            showGroupListInPopup(locKey);
                        } else if (currentItems.length === 1) {
                            showItemDetailInPopup(locKey, currentItems[0].id, false, 0);
                        }
                    });
                } catch (err) {}
            });

            renderSidebar();
            renderTimeline();
            renderGallery();
            updateFolderSelect();
            
            lucide.createIcons();

            Fancybox.bind("[data-fancybox]", {
                Hash: false, Thumbs: false,
                Toolbar: { display: { left: ["infobar"], middle: [], right: ["zoomIn", "zoomOut", "close"] } }
            });
        }

            const tabs = ['folders', 'timeline', 'gallery'];

                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                const view = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
                
                if (t === tabName) {
                    if (btn) {
                        btn.classList.add('bg-[#fdfbf7]', 'shadow-xs');
                        btn.classList.remove('hover:bg-[#fdfbf7]/60');

                    if (btn) {
                        btn.classList.remove('bg-[#fdfbf7]', 'shadow-xs');
                        btn.classList.add('hover:bg-[#fdfbf7]/60');
                    }
                    if (view) view.classList.add('hidden');
                }
            });

            if (tabName === 'timeline') {
                openStoryStage();
            } else {
                closeStoryStage();
                toggleMobileList(false);
            }

            const btnReturn = document.getElementById('btnReturnToEnvelope');
            if (!isEditMode && document.getElementById('viewCoverStage').classList.contains('hidden')) {
                if (btnReturn) btnReturn.classList.remove('hidden');
            }

            lucide.createIcons();

            return markersData.filter(m => formatDateString(m.date) && m.in_timeline !== 'no').sort((a, b) => {
                const dateA = formatDateString(a.date);
                const dateB = formatDateString(b.date);
                if (dateA === dateB) return (a.order || 0) - (b.order || 0);

        function renderTimeline() {
            const container = document.getElementById('timelineContainer');
            if (!container) return;
            container.innerHTML = '';

            const sortedItems = markersData.filter(m => {
                if (!formatDateString(m.date)) return false;
                if (!isEditMode && m.in_timeline === 'no') return false;
                return true;
            }).sort((a, b) => {

        function renderOverviewTrack(sortedItems, currentItem) {
            if (!sortedItems || sortedItems.length === 0) return;

            const monthSet = new Set();
            sortedItems.forEach(item => {
                const dStr = formatDateString(item.date);
                if (dStr && dStr.length >= 7) {
                    monthSet.add(dStr.slice(0, 7));
                }
            });

            const uniqueMonths = Array.from(monthSet).sort();
            if (uniqueMonths.length === 0) return;

            const totalMonths = uniqueMonths.length;

            const ticksBox = document.getElementById('timelineMonthTicks');
            if (ticksBox) {
                ticksBox.innerHTML = uniqueMonths.map((ym, idx) => {
                    const pct = (idx / totalMonths) * 100;
                    const parts = ym.split('-');
                    const ymLabel = `${parts[0].slice(2)}/${parts[1]}`;

                    return `
                        <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 flex flex-col items-center pointer-events-none" style="left: ${pct}%;">
                            <div class="w-[1.5px] h-3 bg-white/30"></div>
                            <span class="text-[9px] font-mono text-slate-300 tracking-tight select-none mt-1.5 drop-shadow">${ymLabel}</span>
                        </div>
                    `;
                }).join('');
            }

            const dateGroups = {};
            sortedItems.forEach(item => {
                const dStr = formatDateString(item.date);
                if (!dStr) return;
                if (!dateGroups[dStr]) dateGroups[dStr] = [];
                dateGroups[dStr].push(item);
            });

            let nodesHtml = '';
            let activeItemPos = { pct: 0, offsetY: 0 };
            const yPattern = [0, -3, 3, -2, 2];

            sortedItems.forEach((item) => {
                const dStr = formatDateString(item.date);
                if (!dStr) return;

                const parts = dStr.split('-');
                const year = parseInt(parts[0], 10);
                const month = parseInt(parts[1], 10);
                const day = parseInt(parts[2], 10);
                const ymKey = `${year}-${String(month).padStart(2, '0')}`;

                const mIdx = uniqueMonths.indexOf(ymKey);
                if (mIdx === -1) return;

                const group = dateGroups[dStr] || [item];
                const itemIndexInDay = group.indexOf(item);
                const countInDay = group.length;

                const daysInMonth = new Date(year, month, 0).getDate();

                const mStartPct = (mIdx / totalMonths) * 100;
                const mWidthPct = 100 / totalMonths;

                const dayFraction = (day - 1 + (itemIndexInDay / Math.max(1, countInDay))) / daysInMonth;
                let pct = mStartPct + (mWidthPct * dayFraction);
                pct = Math.max(0, Math.min(100, pct));

                const offsetY = yPattern[itemIndexInDay % yPattern.length];
                const isCurrent = (item.id === currentItem.id);

                if (isCurrent) {
                    activeItemPos = { pct, offsetY };
                }

                nodesHtml += `
                    <div onclick="jumpToItem('${item.id}')" 
                         class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 cursor-pointer group z-10 p-1 transition-transform hover:scale-150" 
                         style="left: ${pct}%; transform: translate(-50%, calc(-50% + ${offsetY}px));" 
                         title="${dStr} - ${item.title}">
                        <div class="w-1.5 h-1.5 rounded-full transition-all duration-300 ${isCurrent ? 'bg-pink-400 ring-2 ring-pink-300 shadow-[0_0_8px_#f472b6] scale-125' : 'bg-amber-300/85 group-hover:bg-pink-300'}"></div>
                    </div>
                `;
            });

            const nodesBox = document.getElementById('timelineDateNodes');
            if (nodesBox) nodesBox.innerHTML = nodesHtml;

            const cursor = document.getElementById('timelineActiveCursor');
            if (cursor) {
                cursor.style.left = `${activeItemPos.pct}%`;
                cursor.style.transform = `translate(-50%, calc(-50% + ${activeItemPos.offsetY}px))`;
                
                cursor.classList.remove('animate-heartbeat');
                void cursor.offsetWidth;
                cursor.classList.add('animate-heartbeat');
            }
        }

        function makeBubbleDraggable() {
            const bubble = document.getElementById('storyBubble');
            if (!bubble || bubble.dataset.dragInit) return;
            bubble.dataset.dragInit = "true";

            let isDragging = false;
            let startX, startY, initialLeft, initialTop;

            bubble.addEventListener('pointerdown', (e) => {
                const notesEl = document.getElementById('storyBubbleNotes');
                if (e.target === notesEl && notesEl.scrollHeight > notesEl.clientHeight) {
                    return; 
                }

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;

                const rect = bubble.getBoundingClientRect();
                const parentRect = bubble.parentElement.getBoundingClientRect();

                initialLeft = rect.left - parentRect.left;
                initialTop = rect.top - parentRect.top;

                bubble.style.left = `${initialLeft}px`;
                bubble.style.top = `${initialTop}px`;
                bubble.style.right = 'auto';
                bubble.style.bottom = 'auto';

                try { bubble.setPointerCapture(e.pointerId); } catch(err){}
            });

            bubble.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                bubble.style.left = `${initialLeft + dx}px`;
                bubble.style.top = `${initialTop + dy}px`;
            });

            const stopDrag = (e) => {
                if (isDragging) {
                    isDragging = false;
                    try { bubble.releasePointerCapture(e.pointerId); } catch(err){}
                }
            };

            bubble.addEventListener('pointerup', stopDrag);
            bubble.addEventListener('pointercancel', stopDrag);
        }

                mediaBox.classList.add('animate-location-shift');

                const bubble = document.getElementById('storyBubble');

                void mediaContent.offsetWidth;

            document.getElementById('storyBubbleNotes').innerText = item.notes ? item.notes : '這一天也留下了甜甜的回憶～ (´∀`)';

        window.jumpToItem = function(itemId) {
            const sortedItems = getSortedTimelineItems();
            const targetIndex = sortedItems.findIndex(m => m.id === itemId);

        function nextTimelinePhoto() {
            const sortedItems = getSortedTimelineItems();
            if (sortedItems.length === 0) return;

            const item = sortedItems[currentPlaybackItemIndex];
            const rawImages = parseImageUrls(item ? item.image_url : '');
            const hasVideo = item && item.video_url && item.video_url.trim() ? 1 : 0;
            const totalMedia = rawImages.length + hasVideo;

            currentPlaybackImgIndex++;
            let isNewLocation = false;

            if (currentPlaybackImgIndex >= Math.max(1, totalMedia)) {
                currentPlaybackItemIndex++;
                currentPlaybackImgIndex = 0;
                isNewLocation = true;
                if (currentPlaybackItemIndex >= sortedItems.length) {
                    currentPlaybackItemIndex = 0;
                }
            }

            showCurrentTimelineStep(isNewLocation);
        }

        function prevTimelinePhoto() {
            const sortedItems = getSortedTimelineItems();
            if (sortedItems.length === 0) return;

            currentPlaybackImgIndex--;
            let isNewLocation = false;

            if (currentPlaybackImgIndex < 0) {
                currentPlaybackItemIndex--;
                isNewLocation = true;
                if (currentPlaybackItemIndex < 0) {
                    currentPlaybackItemIndex = sortedItems.length - 1;
                }
                const prevItem = sortedItems[currentPlaybackItemIndex];
                const prevRawImages = parseImageUrls(prevItem ? prevItem.image_url : '');
                const prevHasVideo = prevItem && prevItem.video_url && prevItem.video_url.trim() ? 1 : 0;
                const prevTotalMedia = prevRawImages.length + prevHasVideo;
                currentPlaybackImgIndex = Math.max(0, prevTotalMedia - 1);
            }

            showCurrentTimelineStep(isNewLocation);
        }

        function focusPlace(lat, lng, id) {
            const targetLat = parseFloat(lat);
            const targetLng = parseFloat(lng);

            const sortedItems = getSortedTimelineItems();
            const foundIdx = sortedItems.findIndex(m => m.id === id);
            if (foundIdx !== -1) {
                currentPlaybackItemIndex = foundIdx;
                currentPlaybackImgIndex = 0;
            }

            const isTimelineTabActive = !document.getElementById('viewTimeline').classList.contains('hidden');
            if (isTimelineTabActive) {
                openStoryStage();
            } else if (!isNaN(targetLat) && !isNaN(targetLng)) {
                closeStoryStage();
                
                if (window.innerWidth < 768) {
                    toggleMobileList(true);
                }

                const locKey = getLocKey(targetLat, targetLng);
                const marker = locKey ? markerInstances[locKey] : null;

                if (marker) {
                    marker.addTo(map);
                    centerPopupOnMap(targetLat, targetLng);

                    document.querySelectorAll('.marker-pink-pulse').forEach(el => el.classList.remove('marker-pink-pulse'));
                    if (marker._icon) {
                        marker._icon.classList.add('marker-pink-pulse');
                    }

                    const groups = getGroupedItems();
                    const items = groups[locKey] || [];
                    showItemDetailInPopup(locKey, id, items.length > 1, 0);
                }
            }

            updateTimelineHighlight(id);

            const item = markersData.find(m => m.id === id);
            if (isEditMode && item) {
                openEditPanelForItem(item);
            }
        }

                if (sidebarTabs) sidebarTabs.classList.remove('hidden');
                
                const coverStage = document.getElementById('viewCoverStage');
                if (coverStage) coverStage.classList.add('hidden', 'opacity-0', 'pointer-events-none');
                if (btnReturn) btnReturn.classList.add('hidden');
            } else {
                if (editFolderHeader) editFolderHeader.classList.add('hidden');
                if (btnToggle) btnToggle.classList.add('hidden');
                if (sidebarTabs) sidebarTabs.classList.add('hidden');
                
                closePanel();

                if (btnReturn && document.getElementById('viewCoverStage').classList.contains('hidden')) {
                    btnReturn.classList.remove('hidden');
                }
            }
            
            renderSidebar();
            renderTimeline();
            renderGallery();
            lucide.createIcons();
        }

        if (gasUrl) fetchCloudData();
        applyAuthDOMChanges();
    </script>
</body>
</html>
